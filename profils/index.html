<head>

<title>Les neuf profils au travail</title>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --fond:#f6f4f0; --carte:#ffffff; --encre:#1d1b19; --doux:#5f5a54; --pale:#8b857d; --trait:#e7e2da; --trait2:#d8d1c6;
  --coeur:#c2185b; --coeur-f:#fbe9f0; --ventre:#b26a00; --ventre-f:#fdf1df; --tete:#1f5fbf; --tete-f:#e6eefb;
  --vert:#2e7d4f; --vert-f:#e5f3ea; --rouge:#b3261e; --rouge-f:#fbe7e5; --ambre:#9a6700; --ambre-f:#fbf1d9;
  --ombre:0 1px 2px rgba(30,25,20,.05),0 6px 24px rgba(30,25,20,.06);
  --r:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --fond:#141312; --carte:#1e1c1a; --encre:#f1ede7; --doux:#b9b2a8; --pale:#8d867d; --trait:#2e2b28; --trait2:#3b3733;
    --coeur:#f06292; --coeur-f:#3a1d29; --ventre:#f0a43a; --ventre-f:#38291a; --tete:#6fa3f0; --tete-f:#1b2638;
    --vert:#6cc48f; --vert-f:#1a2e22; --rouge:#f28b82; --rouge-f:#3a1f1d; --ambre:#e8b84a; --ambre-f:#342a14;
    --ombre:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
    --fond:#141312; --carte:#1e1c1a; --encre:#f1ede7; --doux:#b9b2a8; --pale:#8d867d; --trait:#2e2b28; --trait2:#3b3733;
    --coeur:#f06292; --coeur-f:#3a1d29; --ventre:#f0a43a; --ventre-f:#38291a; --tete:#6fa3f0; --tete-f:#1b2638;
    --vert:#6cc48f; --vert-f:#1a2e22; --rouge:#f28b82; --rouge-f:#3a1f1d; --ambre:#e8b84a; --ambre-f:#342a14;
    --ombre:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fond);color:var(--encre);font:16px/1.55 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:inherit}
.barre{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:color-mix(in srgb,var(--fond) 86%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--trait)}
.retour{display:none;align-items:center;gap:6px;border:0;background:var(--carte);box-shadow:var(--ombre);border-radius:999px;padding:7px 14px 7px 10px;font-weight:600;font-size:15px;cursor:pointer}
.retour.vu{display:inline-flex}
.barre .titre{font-weight:600;font-size:15px;color:var(--doux);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.accueil-btn{border:0;background:none;cursor:pointer;padding:6px;border-radius:10px;color:var(--doux)}
main{max-width:760px;margin:0 auto;padding:18px 16px 80px}
.vue{animation:entre .32s cubic-bezier(.2,.7,.2,1)}
@media (prefers-reduced-motion: reduce){.vue{animation:none}}
@keyframes entre{from{transform:translateY(10px)}to{transform:none}}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:650;letter-spacing:-.01em;line-height:1.15;margin:0}
h1{font-size:clamp(30px,8vw,44px)}
h2{font-size:24px;margin:34px 0 12px}
h3{font-size:19px;margin:0 0 8px}
p{margin:0 0 10px}
.sur{font-size:12.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--pale);margin-bottom:8px}
.lead{font-size:18px;color:var(--doux)}
.carte{background:var(--carte);border-radius:var(--r);box-shadow:var(--ombre);padding:18px;margin:12px 0}
.grille{display:grid;gap:12px}
@media(min-width:620px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}}
.puce{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;font-weight:700;color:#fff;flex:none;font-size:15px}
.c-coeur{--c:var(--coeur);--cf:var(--coeur-f)} .c-ventre{--c:var(--ventre);--cf:var(--ventre-f)} .c-tete{--c:var(--tete);--cf:var(--tete-f)}
.puce{background:var(--c,#555)}
ul.l{margin:0;padding:0;list-style:none}
ul.l li{position:relative;padding:5px 0 5px 22px}
ul.l li::before{content:"";position:absolute;left:4px;top:14px;width:7px;height:7px;border-radius:50%;background:var(--c,var(--pale))}
ul.ok li::before{background:var(--vert)} ul.ko li::before{background:var(--rouge)}
.plus{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;margin-top:12px;padding:11px 14px;border:1px solid var(--trait2);border-radius:12px;background:transparent;cursor:pointer;font-weight:600;font-size:15px;color:var(--c,var(--encre));text-align:left}
.plus:hover{background:var(--cf,var(--trait))}
.plus span.f{font-size:18px;transition:transform .2s}
.plus:hover span.f{transform:translateX(3px)}
.lien{display:flex;align-items:center;gap:14px;cursor:pointer;border:0;width:100%;text-align:left}
.note{font-size:13.5px;color:var(--pale)}
.bandeau{border-radius:var(--r);padding:16px 18px;background:var(--ambre-f);color:var(--encre);margin:14px 0;font-size:15px}
.bandeau b{color:var(--ambre)}
.etiq{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--cf,var(--trait));color:var(--c,var(--doux));letter-spacing:.02em}
/* Accueil */
.scene-accueil .msg{display:inline-flex;gap:8px;align-items:center;background:var(--encre);color:var(--fond);border-radius:14px;padding:9px 14px;font-weight:600;font-size:15px;margin:10px 0 14px}
.reac{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--trait)}
.reac:first-of-type{border-top:0}
.reac p{margin:0}
.reac .qui{font-weight:600}
.cercle{max-width:420px;margin:0 auto;display:block}
.cercle .noeud{cursor:pointer}
.cercle .noeud:hover circle{filter:brightness(1.1)}
.carte-centre{border-top:5px solid var(--c);cursor:pointer;transition:transform .15s}
.carte-centre:hover{transform:translateY(-2px)}
.carte-centre .mot{font-family:Fraunces,serif;font-size:22px;color:var(--c)}
.menu-outils .lien{padding:14px 16px;background:var(--carte);border-radius:14px;box-shadow:var(--ombre);margin:10px 0}
.menu-outils .ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--trait);font-size:19px;flex:none}
.menu-outils b{display:block}
.menu-outils small{color:var(--pale);font-size:13.5px}
/* Fiche */
.tete-fiche{border-radius:22px;padding:22px 20px;background:var(--cf);margin-bottom:14px;position:relative;overflow:hidden}
.tete-fiche .gros{font-family:Fraunces,serif;font-size:96px;line-height:.8;color:var(--c);opacity:.18;position:absolute;right:14px;top:10px}
.tete-fiche .sur{padding-right:64px}
.tete-fiche .devise{font-family:Fraunces,serif;font-size:19px;margin:10px 0 6px;font-style:italic}
.dyn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dyn .d{border-radius:16px;padding:14px;background:var(--carte);box-shadow:var(--ombre)}
.dyn .d .k{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em}
.dyn .stress .k{color:var(--rouge)} .dyn .conf .k{color:var(--vert)}
.dyn .vers{display:flex;align-items:center;gap:8px;margin:6px 0;font-weight:600}
.dyn .vers .puce{width:28px;height:28px;font-size:13px}
.dyn p{font-size:14.5px;margin:0;color:var(--doux)}
.jauge{display:grid;gap:8px}
.jauge .n{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:start;padding:10px 12px;border-radius:12px}
.jauge .n b{font-size:13px}
.jauge .n p{margin:0;font-size:14.5px}
.n.bien{background:var(--vert-f)} .n.bien b{color:var(--vert)}
.n.moyen{background:var(--ambre-f)} .n.moyen b{color:var(--ambre)}
.n.mal{background:var(--rouge-f)} .n.mal b{color:var(--rouge)}
.scene{border-left:4px solid var(--c);padding:4px 0 4px 16px;margin:6px 0}
.scene .t{font-weight:700;margin-bottom:4px}
.scene p{font-style:italic;color:var(--doux)}
.deux{display:grid;gap:12px}
@media(min-width:620px){.deux{grid-template-columns:1fr 1fr}}
.duo-mini{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.duo-mini button{border:0;cursor:pointer;padding:0;background:none}
/* tableau */
.tab{width:100%;border-collapse:separate;border-spacing:0;font-size:14.5px}
.tab td,.tab th{padding:10px;border-bottom:1px solid var(--trait);vertical-align:top;text-align:left}
.tab th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--pale)}
.ligne-type{cursor:pointer}
.mat{display:grid;grid-template-columns:28px repeat(9,1fr);gap:4px;max-width:520px;margin:0 auto}
.mat .h{display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--pale)}
.mat button{aspect-ratio:1;border:0;border-radius:8px;cursor:pointer;font-size:11px;font-weight:600;background:var(--trait);color:var(--doux)}
.mat button:hover{background:var(--encre);color:var(--fond)}
.mat button.sel{background:var(--encre);color:var(--fond)}
/* test */
.q{padding:14px 0;border-top:1px solid var(--trait)}
.q p{margin:0 0 10px;font-weight:500}
.echelle{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.echelle button{border:1px solid var(--trait2);background:var(--carte);border-radius:10px;padding:9px 0;cursor:pointer;font-weight:600;font-size:14px}
.echelle button.on{background:var(--encre);color:var(--fond);border-color:var(--encre)}
.echelle-leg{display:flex;justify-content:space-between;font-size:12px;color:var(--pale);margin-top:4px}
.progress{height:6px;border-radius:9px;background:var(--trait);overflow:hidden;margin:10px 0}
.progress i{display:block;height:100%;background:var(--encre);transition:width .3s}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:12px;padding:12px 18px;background:var(--encre);color:var(--fond);font-weight:600;cursor:pointer}
.btn.sec{background:var(--trait);color:var(--encre)}
.barre-res{display:grid;grid-template-columns:150px 1fr 34px;gap:10px;align-items:center;margin:6px 0;font-size:14px}
.barre-res .b{height:10px;border-radius:9px;background:var(--trait);overflow:hidden}
.barre-res .b i{display:block;height:100%;background:var(--c)}
.pied{margin-top:40px;padding-top:16px;border-top:1px solid var(--trait);font-size:13px;color:var(--pale)}
.theme{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));border:0;width:42px;height:42px;border-radius:50%;background:var(--carte);box-shadow:var(--ombre);cursor:pointer;font-size:18px}
@media (max-width:480px){
  .jauge .n{grid-template-columns:1fr;gap:2px}
  .dyn .vers span:last-child{font-size:14px;line-height:1.2}
  .dyn .d{padding:12px}
  .carte{padding:16px}
  .carte-centre{padding:14px 16px}
  .carte-centre .mot{font-size:20px}
  .tab{font-size:13.5px}.tab td,.tab th{padding:8px 6px}
  .barre-res{grid-template-columns:118px 1fr 30px;font-size:13px}
}
.chev{font-size:22px;color:var(--pale);line-height:1}
.ic-c{width:10px;height:38px;border-radius:6px;flex:none}
.mini{display:flex;align-items:center;gap:16px;padding:12px 16px}
.mini svg{width:150px;flex:none}
.mini .leg{display:grid;gap:8px;font-size:14px;font-weight:600}
.mini .leg i{display:inline-block;width:18px;height:4px;border-radius:2px;margin-right:8px;vertical-align:middle}
.intro{text-align:center;padding-top:6px}
.intro .sur{margin-bottom:6px}
.grand-cercle{display:block;width:100%;max-width:460px;margin:4px auto 0;touch-action:manipulation}
.grand-cercle .noeud{cursor:pointer;transition:opacity .25s}
.grand-cercle .trace{stroke-dasharray:240;stroke-dashoffset:240;animation:trace .5s ease-out forwards}
@keyframes trace{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.grand-cercle .trace{animation:none;stroke-dashoffset:0}}
.legende{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;font-size:13.5px;font-weight:600;color:var(--doux)}
.legende i,.fl2 i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.fl2 i{width:18px;height:4px;border-radius:2px}
.choix{animation:entre .3s cubic-bezier(.2,.7,.2,1)}
.fl2{display:grid;gap:6px;margin-top:14px;padding-top:12px;border-top:1px solid var(--trait);font-size:14.5px}
.bandeau.court{margin-top:22px}
.menu-btn{display:inline-flex;align-items:center;gap:7px;border:0;background:var(--carte);box-shadow:var(--ombre);border-radius:999px;padding:8px 14px;font-weight:600;font-size:15px;cursor:pointer}
.voile{position:fixed;inset:0;background:rgba(20,16,12,.32);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.feuille{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:86vh;overflow:auto;background:var(--fond);border-radius:22px 22px 0 0;padding:10px 16px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.7,.2,1);box-shadow:0 -10px 40px rgba(0,0,0,.18)}
@media(min-width:700px){.feuille{left:auto;top:0;bottom:0;width:380px;max-height:none;border-radius:0;transform:translateX(105%);padding-top:calc(18px + env(safe-area-inset-top))}}
.menu-ouvert .voile{opacity:1;pointer-events:auto}
.menu-ouvert .feuille{transform:none}
.poignee{width:42px;height:5px;border-radius:9px;background:var(--trait2);margin:2px auto 12px}
@media(min-width:700px){.poignee{display:none}}
.m-lien{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:var(--carte);border-radius:14px;padding:13px 16px;margin:6px 0;cursor:pointer;box-shadow:var(--ombre)}
.m-lien span:first-child{flex:1}.m-lien small{display:block;color:var(--pale);font-size:13px}
.m-lien.ici{outline:2px solid var(--encre)}
.grille-types{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.pastille{display:flex;align-items:center;gap:8px;width:100%;border:0;background:var(--carte);box-shadow:var(--ombre);border-radius:14px;padding:9px 10px;margin:0 0 8px;cursor:pointer;font-weight:600;font-size:14px;text-align:left;transition:transform .15s}
.pastille:hover{transform:translateY(-1px)}
.pastille .puce{width:28px;height:28px;font-size:13px}
.pastille span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pastille.ici{outline:2px solid var(--c)}
.grille-types .pastille{margin:0;flex-direction:column;gap:5px;padding:10px 4px;font-size:12.5px}
.trois-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.trois-col .sur{font-size:11px}
@media(max-width:480px){.trois-col .pastille{flex-direction:column;gap:5px;padding:10px 4px;font-size:12.5px;text-align:center}.trois-col .pastille span:last-child{white-space:normal}}
.fil{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;color:var(--pale);margin:0 0 10px}
.fil a{color:var(--doux);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--trait2);cursor:pointer}
.fil b{color:var(--encre);font-weight:600}
.choix-type{display:flex;gap:5px;overflow-x:auto;padding:2px 0 12px;margin-bottom:4px;scrollbar-width:none}
.choix-type::-webkit-scrollbar{display:none}
.choix-type button{flex:none;width:32px;height:32px;border-radius:50%;border:1.5px solid var(--c);background:transparent;color:var(--c);font-weight:700;font-size:14px;cursor:pointer}
.choix-type button.ici{background:var(--c);color:#fff}
.grand-cercle .halo{opacity:0;transform-box:fill-box;transform-origin:center;animation:halo 1.6s ease-out 2}
@keyframes halo{0%{opacity:.5;transform:scale(1)}100%{opacity:0;transform:scale(2.1)}}
.grand-cercle .noeud:hover .pastille-c{transform:scale(1.12)}
.grand-cercle .pastille-c{transition:transform .18s}
.grand-cercle .invite{animation:invite 2.4s ease-in-out infinite}
@keyframes invite{0%,100%{opacity:1}50%{opacity:.55}}
@media (prefers-reduced-motion: reduce){.grand-cercle .halo,.grand-cercle .invite{animation:none}}
@media(max-width:480px){.retour.vu ~ .titre{visibility:hidden}}
@media print{.barre,.theme,.plus{display:none}}
</style>
</head>
<body>
<header class="barre">
  <button class="retour" id="retour" aria-label="Retour">‹ Retour</button>
  <div class="titre" id="titre">Les neuf profils au travail</div>
  <button class="menu-btn" id="menu" aria-label="Menu" aria-expanded="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span>Menu</span></button>
</header>
<div class="voile" id="voile"></div>
<nav class="feuille" id="feuille" aria-label="Navigation"></nav>
<main id="app"></main>
<button class="theme" id="theme" aria-label="Changer de thème">◐</button>
<script>
const TYPES = [{"n": 1, "nom": "Le Perfectionniste", "alias": "le Réformateur, l'Idéaliste, « celui qui veut bien faire »", "centre": "ventre", "devise": "Le monde est imparfait. J'essaie de bien faire.", "enUnMot": "Bien faire, à chaque étape, et que les choses soient justes ; au fond, être quelqu'un de bien, intègre et irréprochable.", "voit": "Là où d'autres voient le résultat, il voit l'écart avec ce qui devrait être : la faute, l'étape oubliée, la règle contournée. H. Palmer le résume ainsi : « une erreur de dix pour cent occupe l'esprit à cent pour cent ».", "apporte": ["Il garantit la qualité et repère les failles d'un plan avant tout le monde.", "Il crée de la structure : méthodes, étapes, responsabilités claires.", "Il est fiable : il tient parole et rectifie ce qui ne va pas.", "Il montre l'exemple, défend l'éthique de l'équipe et soutient ceux qui font des efforts."], "pieges": ["Il peaufine des détails et prend du retard.", "Il délègue mal : « personne ne le fera aussi bien ».", "Il critique plus qu'il ne propose, et voit tout en noir ou blanc.", "Il travaille trop, puis en veut à ceux qui en font moins."], "stress": {"vers": 4, "resume": "Quand la discipline ne suffit plus, il tend à se sentir incompris, à s'assombrir et à se comparer : « les autres ont la vie plus facile ».", "signes": ["Il se replie, devient mélancolique et parle moins.", "Il se sent seul à porter le travail et incompris de sa hiérarchie.", "Son autocritique devient plus dure ; le temps libre l'angoisse."]}, "confiance": {"vers": 7, "resume": "Libéré du devoir, il s'autorise le plaisir, la curiosité et la nouveauté.", "signes": ["Il propose d'essayer une méthode nouvelle, juste pour voir.", "Il rit plus volontiers et accepte l'imprévu.", "Il s'ouvre à d'autres points de vue que le sien."]}, "niveaux": {"bien": "Sage et tolérant, il discerne sans condamner et accepte qu'il existe plusieurs bonnes façons de faire. Il montre l'exemple sans prêcher, et sait aussi se détendre.", "moyen": "Sérieux, ordonné, ponctuel, mais tendu et irritable. Il corrige, explique, contrôle, et se sent seul à tout porter.", "mal": "Rigide et moralisateur, il se pose en seul juge du bien et du mal. Il devient dur envers lui-même et envers les autres, jusqu'à l'épuisement."}, "communiquer": {"style": "Il a tendance à expliquer, corriger et enseigner : « je devrais », « il faut », « ce n'est pas correct ». H. Palmer souligne que sa tension intérieure, qu'il vit comme de l'énergie, est souvent perçue par les autres comme de la colère.", "faire": ["Soyez clair et précis : objectifs, étapes, qui est responsable de quoi.", "Commencez par ce qui va, puis critiquez avec douceur : il s'est déjà jugé.", "Reconnaissez vos erreurs : il pardonne à qui les assume.", "Soignez vos documents : une faute peut lui faire douter de tout le reste."], "eviter": ["Le contredire ou le critiquer en public.", "Les consignes vagues, ou changées sans explication ni préavis.", "Le travail bâclé, les règles contournées, ou tirer gloire du travail des autres."]}, "scene": {"titre": "Le rapport du vendredi", "texte": "Claire, comptable dans une PME, relit un rapport que son responsable a déjà validé. Elle y trouve deux coquilles et un tableau mal aligné, et les corrige le soir, chez elle. Le lundi, un collègue lui rend un dossier approximatif : elle ne dit rien, mais son « merci » est un peu sec."}, "approfondir": {"communication": {"parle": "Il parle de façon précise, structurée, souvent normative : ce qui est juste, ce qu'il faudrait faire. Il explique et enseigne volontiers, ce qui peut sonner comme un sermon. Il hésite pourtant à critiquer le premier, de peur de se tromper ; sa confiance grandit si quelqu'un d'autre prend la parole avant lui (H. Palmer).", "ecoute": "Il entend d'abord les erreurs, les approximations et les incohérences, avant le fond. Ce qu'il voulait être une aide pour progresser, l'autre le reçoit souvent comme une critique ; inversement, il reçoit la moindre remarque comme un reproche.", "signauxPositifs": ["Consciencieux, d'une éthique élevée, travailleur, bien organisé.", "Un critique constructif, qui voit comment les choses pourraient être à leur mieux.", "Un défenseur des causes importantes."], "signauxNegatifs": ["Rigidité et difficulté à se détendre.", "Une tendance à trouver des défauts chez les autres.", "Une pensée en noir ou blanc, sans nuance, qui peut mettre mal à l'aise."], "retour": ["Commencez par ce qui est réussi, de façon précise et sincère.", "Formulez la critique comme un ajustement, en privé, sans remettre tout en cause.", "Appuyez-vous sur des critères objectifs et connus à l'avance."], "tension": ["Repérez les signes : raideur physique et politesse excessive annoncent souvent la colère (H. Palmer).", "Laissez-le expliquer ce qui lui paraît injuste : sa colère se vit comme justifiée.", "Reconnaissez la part de vrai, puis proposez une solution concrète et partagée."], "canal": "Un écrit soigné et précis, complété d'un échange en privé. Il a besoin de règles annoncées à l'avance et de temps pour se préparer ; l'improvisation en public le met en difficulté."}, "progresser": {"forces": ["Une parole fiable : ce qu'il dit, il le fait.", "Une grande clarté sur les règles et les responsabilités.", "Le courage de nommer ce qui n'est pas juste."], "pistes": ["Avant d'émettre une critique, chercher d'abord le positif et une solution à proposer.", "Admettre qu'il existe plusieurs bonnes façons de faire : en choisir une parmi deux.", "Se demander : « Est-il plus important d'avoir raison ou d'être heureux ? »", "Repérer dans son corps (mâchoires, ventre) la tension qui précède l'irritation."]}, "stressDetail": {"paliers": ["Il en fait encore plus, vérifie et revérifie.", "Tension : mâchoires serrées, politesse raide, irritation contenue.", "Il compense les autres et rumine : « si je ne le fais pas, personne ne le fera ».", "Une colère jugée juste éclate, intransigeante : « ce n'était pas de ma faute ».", "Il cesse de s'investir et s'assombrit, parfois jusqu'à l'épuisement."], "revenir": ["Une reconnaissance explicite de son sérieux, sans qu'il ait à la demander.", "Du temps et des délais réalistes pour bien faire, un seul dossier à la fois.", "La permission de faire « assez bien » : « j'ai fait de mon mieux, c'est suffisant »."]}, "ailes": [{"aile": 9, "nom": "l'Idéaliste", "texte": "Plus réservé, plus détaché, tourné vers la vue d'ensemble. Sa colère se voit moins : raideur, impatience."}, {"aile": 2, "nom": "l'Avocat, ou le Défenseur", "texte": "Plus chaleureux et plus engagé auprès des gens. Il plaide pour ses causes et aime convaincre."}], "instincts": {"conservation": {"nom": "Anxiété", "texte": "Le perfectionniste inquiet : chaleureux avec les autres, très dur avec lui-même. Il veut tout prévoir et tout contrôler, au risque de vérifier chaque détail du travail de chacun et de s'épuiser."}, "social": {"nom": "Inadaptabilité", "texte": "Le modèle qui enseigne : il étudie la meilleure façon de faire et la transmet. Plus froid, plus intellectuel, il peut sembler se croire détenteur de la vérité."}, "teteATete": {"nom": "Zèle", "texte": "Le réformateur zélé : plein d'énergie pour une cause, il veut changer les autres. C'est le plus ouvertement en colère des trois, parfois exigeant et dur."}}, "manager": {"planifier": {"force": "Il bâtit un plan précis et écoute tous les avis pendant la conception.", "angle": "Une fois le plan arrêté, il n'accepte plus de remise en cause et écarte les données qui ne collent pas."}, "decider": {"force": "Il pèse chaque détail pour trouver le meilleur choix.", "angle": "Il décide lentement, par peur de l'erreur ; l'urgence et les informations contradictoires le déstabilisent."}, "deleguer": {"force": "Il définit clairement qui fait quoi et selon quelles règles.", "angle": "Il délègue peu, multiplie les contrôles et étouffe la créativité de l'équipe."}, "retour": {"force": "Honnête et précis, il veut aider chacun à progresser.", "angle": "Il voit la faute avant la réussite ; sa critique, voulue utile, est reçue comme dure."}, "conflit": {"force": "Il cherche la justice et des règles égales pour tous.", "angle": "Il a besoin d'avoir raison ; il se tait longtemps, puis s'indigne."}}, "besoins": {"donne": ["Le plaisir d'un travail bien fait, jusqu'au bout.", "Des consignes claires et des rôles bien définis.", "Une équipe motivée, compétente et honnête.", "Un effort reconnu sans avoir à le demander, au service d'une cause juste ou d'un chef qu'il respecte."], "prend": ["Le travail bâclé, les règles contournées.", "Des consignes vagues, ou changées sans explication.", "Être contredit ou critiqué en public.", "Des délais trop courts pour bien faire."]}, "diriger": ["Confiez-lui un domaine clair dont il est responsable : H. Palmer conseille de le placer « à la tête d'une sphère limitée d'influence ».", "Précisez sa marge d'initiative et annoncez tout changement de procédure à l'avance (H. Palmer ; P. et F. Chabreuil).", "Reconnaissez explicitement son sérieux : il ne réclame rien, mais se sent blessé s'il n'est pas reconnu (P. et F. Chabreuil).", "Veillez à l'équilibre de l'équipe : face à une « forte tête » qui se met en avant ou à une équipe peu impliquée, il peut retenir ses efforts (H. Palmer)."], "confusions": [{"avec": 6, "distinguer": "Tous deux attachés aux règles et au devoir. Le 1 est sûr de son opinion et cherche à convaincre ; le 6 doute, cherche à être rassuré et s'appuie sur une autorité extérieure."}, {"avec": 3, "distinguer": "Tous deux efficaces et exigeants. Le 1 suit sa conscience et laisse voir son irritation ; le 3 vise le résultat, change de tactique si besoin et montre l'émotion qui convient."}, {"avec": 8, "distinguer": "Même sens de la justice et même fermeté. Le 1 persuade par le principe (« c'est ce qu'il faut faire ») ; le 8 s'impose par sa conviction et défend « les siens »."}, {"avec": 9, "distinguer": "Tous deux mal à l'aise avec leur colère. Le 1 défend ses principes, quitte à créer le désaccord ; le 9 préserve la paix même s'il a des convictions."}, {"avec": 2, "distinguer": "Tous deux sérieux et au service des autres. Le 1 s'appuie sur des principes et exprime ses irritations ; le 2 vit le service sur le plan affectif et a du mal avec la colère."}]}, "sources": "H. Palmer ; D. Riso et R. Hudson ; P. et F. Chabreuil ; B. Chestnut ; C. Naranjo (sous-types) ; G. Lapid-Bogda ; D. Daniels et V. Price ; M. Bradel."}, {"n": 2, "nom": "L'Altruiste", "alias": "le Donneur, le Pourvoyeur, celui qui aide", "centre": "coeur", "devise": "On a besoin de moi.", "enUnMot": "Se rendre utile et précieux pour les autres ; au fond, il cherche à être apprécié et à compter pour quelqu'un.", "voit": "Des personnes avant des tâches : qui est fatigué, qui a besoin d'un coup de main, qui n'a pas été invité à la réunion. Pour lui, le travail avance par les relations.", "apporte": ["Il crée l'esprit d'équipe et remonte le moral.", "Il repère les besoins des clients, des usagers et des collègues.", "Il met les autres en valeur et les aide à grandir.", "Il construit et entretient un vaste réseau."], "pieges": ["Il dit oui à tout : « c'est plus simple si je le fais ».", "Il promet trop, sans mesurer ce que l'équipe peut tenir.", "Il néglige procédures, chiffres et tâches solitaires.", "Il a des favoris et entre dans les affaires d'autrui sans voir les limites."], "stress": {"vers": 8, "resume": "La douceur tombe : il devient exigeant, autoritaire, accusateur, et fait sentir tout ce qu'il a donné.", "signes": ["De courtes crises d'irritation pour des motifs secondaires.", "Des reproches du type « après tout ce que j'ai fait ! ».", "Il retire son aide et s'éloigne de l'équipe."]}, "confiance": {"vers": 4, "resume": "Moins contraint de plaire, il se demande ce qu'il veut vraiment et devient honnête avec ses propres besoins.", "signes": ["Il dit non sans se justifier longuement.", "Il exprime directement ses besoins et ce qu'il ressent.", "Il cultive ses propres talents et projets."]}, "niveaux": {"bien": "Il aide librement, sans attendre de retour, et sait recevoir. Il peut dire non, et sa générosité soutient vraiment l'équipe.", "moyen": "Il donne en espérant être reconnu, devine les besoins des autres et s'oublie. Une frustration couve sous le sourire.", "mal": "Il se rend indispensable, culpabilise ses collègues et se pose en victime : « sans moi, tout s'effondrerait ». Il peut exploser, puis s'épuiser jusqu'à tomber malade."}, "communiquer": {"style": "Une parole chaleureuse et modulée, tournée vers l'autre : il prend des nouvelles, raconte des histoires de personnes et donne volontiers des conseils, même non sollicités. Selon H. Palmer, il préfère influencer en coulisse plutôt que demander en face, ce qui lui évite d'affronter un refus.", "faire": ["Commencez par un mot personnel et sincère avant d'entrer dans le sujet.", "Reconnaissez concrètement ce qu'il apporte, pas seulement le résultat.", "Demandez son avis en précisant que la décision vous revient.", "Demandez-lui ce dont il a besoin, et n'acceptez pas « rien » comme réponse."], "eviter": ["Une critique sèche, sans un mot positif.", "Le tenir à l'écart d'une réunion ou d'une décision qui le concerne.", "Tenir son aide pour acquise, ou ignorer ses conseils."]}, "scene": {"titre": "Le coup de main", "texte": "Nadia, assistante dans un cabinet d'architectes, reste tard pour aider un collègue débordé, sans qu'il le lui ait demandé. Le lendemain, il présente le dossier en réunion sans la citer. Elle sourit et assure que ce n'est rien ; dans les jours qui suivent, elle se montre pourtant un peu moins disponible pour lui."}, "approfondir": {"communication": {"parle": "Il s'exprime de façon chaleureuse et personnelle, souvent par des récits sur les gens. Il conseille facilement et module son ton selon l'interlocuteur, au point de changer un peu de visage avec chacun. Il dit rarement ce qu'il veut, directement.", "ecoute": "Il entend d'abord la relation : ce que l'autre ressent, ce qu'il attend de lui, s'il est apprécié. Une remarque neutre peut sonner comme un rejet ou un manque de respect.", "signauxPositifs": ["Chaleureux, empathique, généreux.", "Bon promoteur, il sait créer des réseaux.", "Souvent incontournable dans son secteur, un allié précieux."], "signauxNegatifs": ["Une manipulation indirecte, le sentiment d'être indispensable sans l'être.", "Des insinuations ; touché dans sa fierté, il esquive : « ce n'était pas de ma faute ».", "Une humeur instable au travail ; un manque de respect, même sous-entendu, l'irrite."], "retour": ["Commencez par ce qui va, concrètement.", "Puis soyez doux mais clair : une critique trop enrobée ne passe plus.", "Montrez que la critique porte sur le travail, pas sur l'estime que vous lui portez."], "tension": ["Reconnaissez ce qu'il a donné avant d'aborder le désaccord.", "Invitez-le à dire directement ce qu'il veut, plutôt que de passer par d'autres.", "Aidez-le à poser une limite : ce qui relève de son rôle, et ce qui n'en relève pas."], "canal": "Le face-à-face, de préférence : pour lui, le lien compte autant que le message. Un écrit froid ou une décision apprise par d'autres le blesse ; une réunion où il est inclus le motive."}, "progresser": {"forces": ["Il crée vite une relation de confiance.", "Il perçoit finement l'état de son interlocuteur.", "Il sait encourager et valoriser."], "pistes": ["Demandez directement ce que vous voulez, au lieu de manœuvrer en coulisse.", "Avant chaque oui, demandez-vous pourquoi, et différez : « je vous rappelle ».", "Ne donnez un conseil que s'il est demandé.", "Dites votre désaccord tôt, avant que l'irritation ne s'accumule."]}, "stressDetail": {"paliers": ["Il en fait encore plus et s'oublie davantage.", "Il se sent peu reconnu, rumine et se plaint auprès d'autres collègues.", "Petites irritations : il se pose en martyr, « personne ne voit ce que je fais ».", "Une explosion qui surprend tout le monde, sur un ton autoritaire.", "Il retire son aide, s'éloigne, s'épuise, parfois jusqu'à tomber malade."], "revenir": ["Un merci sincère et précis.", "Être de nouveau inclus dans les réunions et les décisions.", "Être aidé à dire non et à alléger sa charge."]}, "ailes": [{"aile": 1, "nom": "le Serviteur", "texte": "Plus discret, guidé par le sens du devoir, il aide dans l'ombre avec rigueur."}, {"aile": 3, "nom": "l'Hôte", "texte": "Plus charmeur, ambitieux et visible, il aime rayonner et être reconnu pour ce qu'il apporte."}], "instincts": {"conservation": {"nom": "Privilège", "texte": "Soutien discret, très bon pour planifier et organiser, modeste sur ce qu'il apporte. Il hésite à prendre les commandes et attend une place à part sans la demander."}, "social": {"nom": "Ambition", "texte": "Dirigeant ou stratège, il se rend indispensable aux personnes influentes et fonctionne par échange de faveurs."}, "teteATete": {"nom": "Séduction", "texte": "Il noue des liens intenses avec quelques collègues clés, a des favoris, et devient insistant quand on ne lui répond pas."}}, "manager": {"planifier": {"force": "Il allège la paperasse au profit des relations.", "angle": "Il improvise plus qu'il ne planifie ; structure et chiffres passent après."}, "decider": {"force": "Il consulte des conseillers de confiance et tient compte de l'humain.", "angle": "Ses décisions penchent vers ses favoris ; sous stress, il ne sait plus trancher."}, "deleguer": {"force": "Il soutient, protège et développe le potentiel de chacun.", "angle": "Il aide trop, crée de la dépendance et peut étouffer l'équipe."}, "retour": {"force": "Il encourage, valorise, voit le potentiel de chacun.", "angle": "Il enrobe la critique au point qu'elle ne passe plus."}, "conflit": {"force": "Il pardonne vite et répare le lien.", "angle": "Il évite le conflit, puis explose quand il se sent négligé."}}, "besoins": {"donne": ["Un merci sincère : « on n'y serait pas arrivés sans vous ».", "Savoir où il en est avec sa hiérarchie.", "Être inclus dans les réunions, les décisions, les moments d'équipe.", "Voir l'effet concret de son aide."], "prend": ["Aucun retour, ou une critique sans un mot positif.", "Être tenu à l'écart d'une réunion.", "Une aide tenue pour acquise, jamais rendue.", "Un poste isolé, sans contact."]}, "diriger": ["Donnez-lui une place claire dans le collectif : cela évite la rivalité avec ses pairs.", "Soutenez-le au démarrage d'une mission : c'est là qu'il peine, ensuite il réussit (Palmer).", "Exprimez une approbation sincère et régulière, et dites-lui pour qui il travaille concrètement.", "Protégez-le de la surcharge : aidez-le à dire non et vérifiez ce qu'il promet au nom de l'équipe."], "confusions": [{"avec": 8, "distinguer": "Le 8 domine ouvertement et dit sa colère en face ; le 2 sous stress devient autoritaire, mais il fait plutôt sentir sa peine pour culpabiliser."}, {"avec": 9, "distinguer": "Le 9 attend, accommodant, et s'efface ; le 2 va chercher l'autre et lui rappelle volontiers ce qu'il a fait pour lui."}, {"avec": 6, "distinguer": "Le 6 envoie des signaux mêlés et cherche une autorité à consulter ; le 2 est démonstratif et devient lui-même celui qui conseille."}]}, "sources": "H. Palmer, P. et F. Chabreuil, B. Chestnut, G. Lapid-Bogda, D. Riso et R. Hudson, D. Daniels, T. Condon et C. Thomson"}, {"n": 3, "nom": "Le Battant", "alias": "le Réalisateur, le Performeur, le Gagnant", "centre": "coeur", "devise": "Je suis ce que je réalise.", "enUnMot": "Atteindre des objectifs visibles et être reconnu pour ses résultats ; au fond, il a tendance à confondre sa valeur avec ce qu'il réussit.", "voit": "Un objectif, et le chemin le plus court pour l'atteindre. Ce qui ne sert pas le but passe au second plan, émotions comprises : « on verra les détails plus tard ».", "apporte": ["Il fixe un cap clair, avec des résultats mesurables.", "Il entraîne l'équipe par son énergie et sa confiance.", "Il accélère quand un projet piétine et tient bon dans l'urgence.", "Il présente et défend remarquablement un projet ou une équipe."], "pieges": ["Il sacrifie la qualité et les détails à la vitesse.", "Il soigne ce qui se voit et néglige ce qui ne le met pas en valeur.", "Il fuit l'échec : il abandonne avant de perdre ou en reporte la faute sur d'autres.", "Il met les collègues en compétition et s'épuise sans le voir."], "stress": {"vers": 9, "resume": "La machine s'arrête : il se disperse dans de petites tâches, se désengage et procrastine, comme si plus rien ne comptait.", "signes": ["Il multiplie les activités sans se concentrer sur ce qui compte.", "Il repousse des échéances qu'il tenait d'habitude sans difficulté.", "Il paraît éteint, en retrait des projets qu'il portait."]}, "confiance": {"vers": 6, "resume": "Il découvre qu'il n'a pas à tout porter seul et s'engage loyalement pour l'équipe et un but commun.", "signes": ["Il valorise la réussite collective plus que la sienne.", "Il ose demander du soutien et reconnaître une difficulté.", "Il devient plus attentif aux besoins de ses collègues."]}, "niveaux": {"bien": "Il réussit sans se trahir et sans avoir à prouver sa valeur. Il aide les autres à donner le meilleur d'eux-mêmes et inspire sincèrement.", "moyen": "Il court après les résultats et l'image, se compare, remplit son agenda. Il met ses émotions de côté pour avancer et ajuste son discours à chaque public.", "mal": "Il enjolive la réalité pour sauver la face et rejette sur d'autres la faute d'un échec. Il s'épuise derrière une façade de réussite, parfois jusqu'à la maladie."}, "communiquer": {"style": "Il parle vite, de façon positive et persuasive : il présente les faits, et se présente lui-même, sous leur meilleur jour pour motiver et convaincre. H. Palmer le décrit comme un caméléon qui change d'image selon l'interlocuteur ; il parle volontiers de ce qu'il fait, beaucoup moins de ce qu'il ressent.", "faire": ["Allez droit au but : objectif, points clés, échéance.", "Fixez des critères de réussite précis et mesurables.", "Reconnaissez ses résultats, si possible devant l'équipe.", "Pour une mauvaise nouvelle, rappelez d'abord l'objectif commun, puis soyez bref."], "eviter": ["Les réunions qui traînent sans rien décider.", "Le mettre en concurrence avec un collègue ou le critiquer devant les autres.", "Les objectifs flous et les longs détours personnels au milieu de la tâche."]}, "scene": {"titre": "Le bilan du lancement", "texte": "Julien, chef de projet dans une société de services, présente le bilan d'un lancement. Il met en avant les trois indicateurs au vert et passe vite sur le retard de livraison. Quand sa responsable y revient, il a déjà une solution et une nouvelle date. Le soir même, il annule un dîner pour peaufiner la présentation du lendemain."}, "approfondir": {"communication": {"parle": "Un discours rapide, structuré autour d'objectifs, de résultats et d'étapes. Il met en avant ce qui avance et minimise les difficultés : les sources parlent d'un style de « propagande » ou d'autopromotion. Il change volontiers de registre selon l'auditoire, au point de paraître très convaincant, parfois trop.", "ecoute": "Il retient ce qui sert l'objectif et filtre ce qui ralentit : détails, doutes, émotions, vie privée évoquée au bureau. Une critique sur son travail peut sonner comme une menace sur sa valeur, même s'il n'en montre rien.", "signauxPositifs": ["Efficace, énergique, bon leader.", "Capable de reprendre en main une équipe ou un projet chancelant.", "Performant dans l'urgence, il mobilise les forces face à un défi extérieur."], "signauxNegatifs": ["Il peut sacrifier l'authenticité à l'image.", "Il peut finir par croire au rôle qu'il joue.", "Sa compétitivité nuit à la cohésion quand il valorise l'exploit personnel plus que la coopération."], "retour": ["Commencez par les résultats obtenus, de façon précise.", "Formulez la critique comme un écart à l'objectif, avec un critère mesurable et un délai.", "Faites-le en tête-à-tête, brièvement, jamais devant l'équipe."], "tension": ["Ramenez l'échange à l'objectif commun.", "Proposez une prochaine étape concrète plutôt que de revenir sur la faute.", "Laissez-lui une sortie honorable : ne l'acculez pas à reconnaître un échec en public."], "canal": "Un échange court et préparé, à l'oral ou par un écrit synthétique : objectif, résultats, prochaine étape. Il apprécie la réunion quand elle décide vite ; il décroche dès qu'elle traîne."}, "progresser": {"forces": ["Il motive et entraîne par son enthousiasme.", "Il sait convaincre et adapter son message à chaque public.", "Il clarifie les objectifs et les critères de réussite."], "pistes": ["Ralentissez votre débit et laissez parler les autres avant de conclure.", "Dites aussi ce qui coince, pas seulement ce qui avance.", "Avant de présenter, demandez-vous : « est-ce pour le projet ou pour mon image ? »", "Après un échec, notez ce qui s'est vraiment passé avant d'en faire une « expérience »."]}, "stressDetail": {"paliers": ["Il met le turbo : encore plus de travail, des journées sans fin.", "Il devient impatient, cassant avec ceux qui le ralentissent.", "Il soigne la façade : « tout va très bien », et cache ses difficultés.", "Il arrange la vérité et rejette sur d'autres la faute d'un échec.", "Il décroche : petites tâches, apathie, épuisement, parfois jusqu'à la maladie."], "revenir": ["Être apprécié pour lui-même, pas seulement pour ses résultats.", "Ralentir vraiment : des pauses, un temps sans objectif dans l'agenda.", "Pouvoir confier une difficulté à une personne de confiance sans perdre la face."]}, "ailes": [{"aile": 2, "nom": "le Charmeur", "texte": "Plus chaleureux et sociable, il travaille la relation pour réussir et veut être apprécié autant qu'admiré."}, {"aile": 4, "nom": "le Professionnel", "texte": "Plus sérieux et réservé, il met sa valeur dans la qualité de son travail ; ambition et doute de soi s'y mêlent."}], "instincts": {"conservation": {"nom": "Sécurité", "texte": "Travailleur acharné et autonome, premier arrivé, dernier parti, modeste sur ses mérites. Il préfère tout faire seul plutôt que demander de l'aide."}, "social": {"nom": "Prestige", "texte": "Il aime présenter, convaincre, gravir les échelons ; titres et reconnaissance comptent. C'est le plus compétitif et le plus « caméléon » des trois."}, "teteATete": {"nom": "Charisme", "texte": "Séduisant, il met souvent son énergie à faire réussir un chef ou un associé, et a du mal à se mettre lui-même en avant."}}, "manager": {"planifier": {"force": "Plannings, échéances, indicateurs : il est dans son élément.", "angle": "La quantité prend le pas sur la qualité, le court terme sur le long terme."}, "decider": {"force": "Il tranche vite, en s'appuyant sur des solutions qui ont fait leurs preuves.", "angle": "Une fois lancé, il met des œillères : avis contraires et mauvaises nouvelles passent mal."}, "deleguer": {"force": "Il délègue volontiers et laisse une grande liberté sur la manière.", "angle": "Il attend de tous son propre rythme et peut installer une compétition interne."}, "retour": {"force": "Il fixe des critères de réussite précis et sait encourager.", "angle": "Il oublie parfois de remercier et supporte mal la critique qui le vise."}, "conflit": {"force": "Il ramène chacun vers l'objectif commun.", "angle": "Sous pression, il devient dur avec ceux qui le retardent et évite la confrontation ouverte."}}, "besoins": {"donne": ["Un objectif clair et un défi à relever.", "Voir avancer ses résultats, cocher ce qui est fait.", "Une reconnaissance visible : un mot en public, une évolution.", "Un rythme soutenu et de la liberté sur la manière de faire."], "prend": ["Les réunions qui traînent sans rien décider.", "Être freiné, interrompu, obligé d'attendre.", "Un projet retiré juste avant qu'il aboutisse.", "Des critères de réussite flous."]}, "diriger": ["Fixez-lui des objectifs clairs, découpés en étapes courtes avec un résultat visible à chacune.", "Rendez explicites les conditions d'évolution et reconnaissez ses mérites, y compris devant l'équipe.", "Évitez de le mettre en concurrence : valorisez les succès d'équipe, définissez les rôles et associez-le à des collègues attentifs à la qualité.", "Guettez le signal précoce : il accélère au lieu de ralentir. Montrez-lui qu'il compte aussi pour lui-même, pas seulement pour ses résultats."], "confusions": [{"avec": 1, "distinguer": "Le 1 suit des principes et laisse voir son irritation ; le 3 suit des objectifs, change de tactique si le résultat tarde et affiche l'émotion qui convient au moment."}, {"avec": 8, "distinguer": "Le 8 cherche le pouvoir, ne se compare pas et affronte le conflit ; le 3 cherche la reconnaissance, se compare sans cesse et redoute l'échec en public."}, {"avec": 7, "distinguer": "Le 7 cherche la variété des expériences et peut être débridé ; le 3 cherche les marques de la réussite et reste maîtrisé, composé."}]}, "sources": "H. Palmer, P. et F. Chabreuil, D. Riso et R. Hudson, B. Chestnut, G. Lapid-Bogda, T. Condon et C. Thomson, É. Salmon, I. M. Cron et S. Stabile"}, {"n": 4, "nom": "Le Romantique", "alias": "l'Individualiste, l'Artiste, l'Original", "centre": "coeur", "devise": "Quelque chose me manque, les autres l'ont.", "enUnMot": "Apporter une contribution personnelle, sincère et qui a du sens ; au fond, il cherche à être pleinement lui-même et reconnu comme unique.", "voit": "Ce qui manque, ce qui a du sens, et ce qui se joue sous la surface entre les personnes. Pour lui, un travail doit être juste, beau et sincère.", "apporte": ["Un regard neuf, décalé, qui bouscule les habitudes.", "Le sens du beau et de la qualité plutôt que de la quantité.", "Le courage de nommer les tensions que personne n'ose dire.", "Une vraie présence auprès de ceux qui traversent une épreuve."], "pieges": ["Il repousse les tâches banales et a tendance à procrastiner.", "Son efficacité suit son humeur.", "Il vit une critique comme un rejet de sa personne.", "Il se compare et rivalise avec ses pairs directs."], "stress": {"vers": 2, "resume": "Après s'être replié, il se rapproche avec une amabilité un peu forcée, cherche à être rassuré et rappelle tout ce qu'il a apporté.", "signes": ["Il réclame d'être rassuré ou remarqué.", "Il rappelle ce qu'il a fait pour l'équipe.", "Il s'occupe des problèmes des autres pour taire les siens."]}, "confiance": {"vers": 1, "resume": "Il passe à l'action avec constance et discipline, et ses idées se concrétisent.", "signes": ["Il tient ses délais, même quand son humeur fluctue.", "Il distingue les faits de ce qu'il en ressent.", "Il coopère davantage et voit ce qui fonctionne."]}, "niveaux": {"bien": "Honnête avec lui-même, il transforme son expérience en réalisations qui touchent chacun. Il sait apprécier ce qu'il a et coopère sans s'isoler.", "moyen": "Il se compare, voit surtout ce qui manque et laisse ses humeurs guider son travail. Il se sent parfois dispensé des règles communes.", "mal": "Il se rejette et en veut aux autres de ne pas l'avoir compris ni soutenu. Abattement, repli, parfois sabotage de ce qui fonctionnait : il a besoin d'aide."}, "communiquer": {"style": "Un langage imagé, intense, souvent personnel, qui cherche la profondeur et fuit la banalité. H. Palmer note qu'il dédaigne la platitude des sentiments ordinaires ; sa recherche de vérité peut être perçue comme de la théâtralité.", "faire": ["Faites l'effort de le comprendre, et reformulez ce qu'il dit.", "Laissez-le exprimer une émotion sans chercher à la « réparer ».", "Dites précisément ce que sa contribution a d'unique.", "Reliez les tâches ordinaires à ce qu'elles permettent."], "eviter": ["Le comparer à un collègue, ou féliciter un autre devant lui.", "« Voyez le bon côté » et les solutions toutes faites.", "Les échanges superficiels et le manque de sincérité."]}, "scene": {"titre": "La charte imposée", "texte": "Inès, graphiste dans une agence, reçoit une charte graphique imposée par le client. Elle la trouve sans caractère et propose une variante plus personnelle, qui est refusée. Elle fait le travail, et bien, mais se sent incomprise. C'est quand on lui demande son regard sur le fond du projet qu'elle retrouve son élan."}, "approfondir": {"communication": {"parle": "Il s'exprime avec intensité, par images et récits personnels, et cherche à aller au fond des choses. Il nomme facilement ce qui manque ou ce qui sonne faux. Ses anecdotes et ses « je » peuvent prendre beaucoup de place.", "ecoute": "Il entend d'abord la sincérité de l'autre et son degré de compréhension. Une critique ou une comparaison est vite reçue comme un jugement sur sa personne.", "signauxPositifs": ["Créatif et profond.", "Grande empathie, fin observateur des nuances émotionnelles.", "Il apporte une touche personnelle et unique à ses réalisations."], "signauxNegatifs": ["Des humeurs théâtrales, une instabilité émotionnelle.", "Une tendance à saboter ce qui fonctionne.", "Des états d'âme qui le rendent parfois décalé pour la vie de tous les jours."], "retour": ["Laissez-le d'abord dire ce qu'il ressent.", "Puis soyez bienveillant et clair, avec des raisons objectives.", "Faites-le en privé, sans jamais le comparer à un collègue."], "tension": ["Accueillez l'émotion sans la minimiser ni l'amplifier.", "Revenez ensuite aux faits et à la prochaine tâche concrète.", "S'il se replie, gardez le lien sans forcer, et reprenez l'échange un peu plus tard."], "canal": "Le face-à-face, sincère et sans témoins, pour tout ce qui touche à son travail ou à une critique. Les messages impersonnels ou les annonces en grande réunion lui donnent souvent le sentiment d'être banalisé."}, "progresser": {"forces": ["Il écoute en profondeur et accueille les émotions difficiles.", "Il ose les conversations délicates.", "Il donne du sens et de la force à un message."], "pistes": ["Réduisez les « je, moi, mon » et raccourcissez vos anecdotes.", "Quand l'émotion monte : « je ressens cela, et quelle tâche m'attend maintenant ? »", "Face à une critique, cherchez ses raisons objectives plutôt qu'un défaut en vous.", "Parlez aussi de ce qui avance, pas seulement de ce qui manque."]}, "stressDetail": {"paliers": ["Ses émotions prennent la place ; il s'absorbe dans son monde intérieur.", "Il se sent incompris, se replie, boude, coopère moins.", "Il se compare, ne voit que ce qui manque et se plaint ouvertement.", "Il s'accroche aux autres, réclame d'être rassuré, rappelle tout ce qu'il a apporté.", "Colère ou abattement : il peut saboter ce qu'il a lui-même construit."], "revenir": ["Être écouté et compris, sans qu'on cherche à le « réparer ».", "Une reconnaissance précise de ce qu'il apporte d'unique.", "Une tâche reliée au sens, et un créneau fixe pour la routine."]}, "ailes": [{"aile": 3, "nom": "l'Aristocrate", "texte": "Plus ambitieux, sociable et visible, il crée pour un public et soigne son image."}, {"aile": 5, "nom": "le Bohème", "texte": "Plus introverti, il crée pour lui-même et défie volontiers les conventions."}], "instincts": {"conservation": {"nom": "Ténacité", "texte": "Souriant, serviable, il porte plus que sa part sans se plaindre. C'est le moins reconnaissable des 4, souvent pris pour un 3 au travail."}, "social": {"nom": "Honte", "texte": "Il se compare, se juge souvent inférieur et dit ce qu'il ressent. Il défend la place de l'authenticité dans le travail."}, "teteATete": {"nom": "Compétition", "texte": "Il veut être le meilleur, réclame, peut sembler arrogant. C'est souvent le plus à l'aise des trois dans un rôle de leader."}}, "manager": {"planifier": {"force": "Il excelle pour lancer, innover et traverser une crise.", "angle": "La routine l'ennuie et les délais lui sont difficiles à tenir."}, "decider": {"force": "Intuitif, il tient compte de l'humain et du sens.", "angle": "Quand il se sent insuffisant, il doute de ses choix et manque parfois de critères objectifs."}, "deleguer": {"force": "Il écoute et laisse chacun montrer ses talents et sa créativité.", "angle": "Il s'attarde sur les relations au détriment des priorités."}, "retour": {"force": "Il est honnête et ne craint pas les conversations difficiles.", "angle": "Il y met plus d'émotion que la situation n'en demande et juge vite les autres superficiels."}, "conflit": {"force": "Il met au jour les tensions cachées et tient compte des sentiments de chacun.", "angle": "Il prend les désaccords pour lui, garde rancune, se replie ou riposte."}}, "besoins": {"donne": ["Être écouté, et qu'on sollicite son avis.", "Un travail créatif, qui a du sens.", "Une reconnaissance précise de ce qu'il apporte d'unique.", "Des échanges sincères et un cadre de travail soigné."], "prend": ["Les tâches répétitives, sans signification.", "S'entendre dire : « voyez le bon côté ».", "Être comparé, ou voir un collègue félicité devant lui.", "Les échanges superficiels, l'hypocrisie."]}, "diriger": ["Confiez-lui un domaine à lui, lié à son expertise, sans homologue avec qui il serait comparé (Palmer).", "Reconnaissez précisément ses mérites : pour lui, cela peut compter autant qu'une augmentation (Palmer).", "Reliez les tâches ordinaires à une finalité et convenez avec lui de créneaux fixes pour la routine.", "Appuyez-vous sur lui pour lancer un projet ou traverser une crise, et accompagnez-le quand tout devient routinier."], "confusions": [{"avec": 1, "distinguer": "Le 1 traite d'abord ses responsabilités, ses émotions ensuite, et impose son avis ; le 4 traite d'abord ses émotions et se retire quand il est blessé."}, {"avec": 5, "distinguer": "Le 5 garde ses émotions privées et observe le réel de façon intellectuelle ; le 4 exprime ses émotions et part de son expérience personnelle."}, {"avec": 6, "distinguer": "Le 6 se tourne vers les autres et ses doutes viennent surtout de l'inquiétude ; le 4 se rapporte d'abord à ses états intérieurs."}]}, "sources": "H. Palmer, P. et F. Chabreuil, B. Chestnut, D. Riso et R. Hudson, G. Lapid-Bogda, D. Daniels et V. Price, M. Bast (dans T. Condon et C. Thomson)"}, {"n": 5, "nom": "L'Observateur", "alias": "l'Investigateur, le Penseur, l'Expert", "centre": "tete", "devise": "Le monde est envahissant.", "enUnMot": "Comprendre et maîtriser son domaine pour se sentir capable, en protégeant son temps, son énergie et son autonomie face aux sollicitations.", "voit": "Il voit d'abord ce qu'il faut comprendre pour maîtriser le dossier, et ce que cela va lui coûter en temps et en énergie. Il repère aussi, presque malgré lui, qui risque de trop le solliciter.", "apporte": ["Une expertise solide : il connaît son domaine à fond et on vient le consulter.", "Une grande capacité d'analyse et de synthèse d'une masse d'informations.", "Un calme réel dans la crise, sans dramatisation.", "Le respect de l'autonomie de chacun : il ne surveille pas, il ne s'impose pas."], "pieges": ["Retenir une information utile, sans s'en rendre compte : « on ne me l'a pas demandée ».", "Repousser l'action tant qu'il n'en sait pas assez.", "Fuir les réunions, l'improvisation et les conflits ; son silence passe alors pour un accord.", "Négliger l'humain (ambiance, émotions, relations) et cloisonner : l'information circule mal."], "stress": {"vers": 7, "resume": "Quand le retrait ne suffit plus, il a tendance à s'agiter et à se disperser, comme un 7 sous pression.", "signes": ["Il saute d'un sujet ou d'un projet à l'autre sans en finir aucun.", "Il accumule les lectures et les recherches de façon désordonnée.", "Il parle plus vite, rit nerveusement ou cherche des distractions."]}, "confiance": {"vers": 8, "resume": "En confiance, il sort de son retrait et prend sa place avec assurance, comme un 8 en bonne forme.", "signes": ["Il donne son avis franchement, au moment où il est utile.", "Il agit sans attendre d'avoir tout préparé.", "Il assume un rôle de responsable, appuyé sur ses analyses."]}, "niveaux": {"bien": "Curieux, lucide et profond, il partage volontiers ce qu'il sait. Il s'engage dans l'action et devient une ressource précieuse pour toute l'équipe.", "moyen": "Il se prépare encore et encore avant d'agir, garde ses distances et protège son temps. Il répond juste à ce qu'on lui demande et devient difficile à joindre.", "mal": "Il se coupe de l'équipe, refuse l'aide et ne transmet plus rien, au risque de bloquer tout un service. Mis au pied du mur, il peut dire les choses de façon brutale, sans mesurer la blessure."}, "communiquer": {"style": "Il parle peu, de façon concise et précise, et en dit rarement plus que nécessaire ; sur son domaine, il peut au contraire développer longuement, de façon très structurée. H. Palmer note qu'il négocie mieux quand il sait d'avance sous quelle forme présenter son point de vue.", "faire": ["Prévenir : ordre du jour, durée et participants avant la réunion.", "Être bref, factuel et précis, et poser des questions claires.", "Annoncer un sujet délicat à l'avance et lui laisser choisir le moment.", "Lui demander son avis en fin de réunion, ou lui confier la synthèse écrite."], "eviter": ["L'interpeller à l'improviste (« Tu as une minute ? ») ou disposer de son temps sans le prévenir.", "Insister pour qu'il exprime ses émotions sur-le-champ.", "Les réunions qui débordent, les bavardages et les épanchements personnels."]}, "scene": {"titre": "La réunion improvisée", "texte": "Marc, ingénieur, est convié dix minutes avant à une réunion pour « réfléchir ensemble ». Il parle peu et prend des notes. Le lendemain matin, il envoie un message de dix lignes, précis et argumenté, qui règle la moitié des questions."}, "approfondir": {"communication": {"parle": "Il répond à la question posée, ni moins ni surtout plus. Il pèse ses mots et préfère l'écrit, qui lui laisse le temps de penser. Sa précision peut être perçue comme de la froideur ou de la distance.", "ecoute": "C'est un auditeur attentif, qui retient les faits, la logique et ce qu'on attend concrètement de lui. Il filtre la charge émotionnelle et se ferme si on lui demande de partager des sentiments.", "signauxPositifs": ["Érudit, réfléchi, explorateur des idées (Palmer).", "Calme et lucide en période de crise (Palmer).", "Discret et fiable : on peut se confier à lui en toute confiance (Palmer)."], "signauxNegatifs": ["Ses collègues peuvent se sentir tenus à l'écart ou négligés (Palmer).", "Son besoin d'être seul est pris pour un rejet (Palmer).", "Son silence est mal interprété, parfois comme un aveu ou un accord (Palmer)."], "retour": ["Le prévenir à l'avance du sujet et lui proposer un créneau défini.", "S'appuyer sur des faits précis et des attentes claires, sans jugement sur la personne.", "Lui laisser du temps pour répondre, éventuellement par écrit."], "tension": ["Ne pas exiger une réponse immédiate : proposer de reprendre le sujet plus tard.", "Revenir aux faits et au problème à résoudre, plutôt qu'aux émotions.", "Respecter son retrait sans le lire comme une hostilité, puis renouer par un point concret."], "canal": "L'écrit (courriel, note) et l'entretien individuel préparé lui conviennent le mieux : ils lui laissent le temps de réfléchir et évitent l'intrusion. Pour lui, mettre à jour une information est une façon neutre de montrer qu'il est présent (Palmer)."}, "progresser": {"forces": ["Une parole précise, sans exagération ni flatterie.", "Une écoute attentive et discrète.", "Une grande clarté à l'écrit et dans les synthèses."], "pistes": ["Partager une information utile sans attendre qu'on la lui demande.", "Dire ce qui le gêne dès qu'il le remarque, sans attendre d'être seul.", "En réunion, rester présent et prendre la parole avant la fin.", "Expliquer ses décisions au lieu de les annoncer seulement."]}, "stressDetail": {"paliers": ["Il se replie : porte fermée, échanges réduits au strict nécessaire.", "Il communique moins, travaille à distance et devient difficile à joindre.", "Il décroche : présent physiquement, absent d'esprit ; il ne répond plus.", "Il s'agite et se disperse, multiplie les idées et les distractions.", "Il peut s'emporter quand on franchit ses limites, puis couper le contact."], "revenir": ["Du temps seul et au calme pour récupérer.", "Un cadre clair : ce qu'on attend de lui, pour quand, et combien de temps cela prendra.", "Un problème intéressant à résoudre, qui le remet en mouvement."]}, "ailes": [{"aile": 4, "nom": "L'Iconoclaste", "texte": "Plus sensible, plus créatif et plus solitaire, attiré par l'insolite et la pensée non conventionnelle."}, {"aile": 6, "nom": "Le Résolveur de problèmes", "texte": "Plus purement analytique, tourné vers les faits, la technique et les systèmes ; plus prudent et méthodique."}], "instincts": {"conservation": {"nom": "Château fort", "texte": "Gardien de son territoire : limites nettes, horaires tenus, peu de demandes pour ne rien devoir en retour. Son amabilité lui sert parfois de bouclier."}, "social": {"nom": "Totem", "texte": "Le spécialiste incontournable de son service, « le seul qui sait réparer l'ordinateur » (Riso et Hudson). Il recherche les cercles d'experts et le savoir de haut niveau."}, "teteATete": {"nom": "Confidence", "texte": "Plus intense qu'il n'y paraît, il noue un lien fort avec quelques collègues de confiance, à qui il se confie."}}, "manager": {"planifier": {"force": "Il définit rôles, délais et étapes avec rigueur.", "angle": "Il reçoit ses collaborateurs un par un : l'information circule mal entre les services."}, "decider": {"force": "Il s'appuie sur les faits ; ni l'émotion ni la flatterie ne l'emportent.", "angle": "Il décide seul et annonce sans expliquer : la décision paraît arbitraire."}, "deleguer": {"force": "Il laisse de l'autonomie et ne fait pas de microgestion.", "angle": "Il est peu disponible : on travaille pour lui plutôt qu'avec lui."}, "retour": {"force": "Il est clair, factuel, sans fioritures.", "angle": "Il oublie d'encourager et de reconnaître ; sa réserve paraît froide."}, "conflit": {"force": "Il garde son calme et ne dramatise pas.", "angle": "Il évite la confrontation et se retire ; son silence est pris pour un accord."}}, "besoins": {"donne": ["Du temps seul pour réfléchir et récupérer.", "Un sujet à approfondir, un problème difficile.", "Des réunions courtes, préparées, qui finissent à l'heure.", "La reconnaissance de son expertise."], "prend": ["Les interruptions et le bureau ouvert à tous.", "Les bavardages et les conflits personnels étalés au travail.", "Les surprises et les tâches données au dernier moment.", "Qu'on dispose de son temps sans le prévenir."]}, "diriger": ["Fixer un cadre clair (objectif, délai, résultat attendu), puis le laisser travailler seul.", "Envoyer l'ordre du jour à l'avance et lui permettre de répondre par écrit.", "Lui confier des dossiers d'expertise qui le stimulent : le défi compte plus pour lui que les titres.", "Lui demander explicitement de partager ses informations avec l'équipe, à des moments prévus."], "confusions": [{"avec": 4, "distinguer": "Tous deux se retirent ; mais le 4 exprime ses émotions et parle de son ressenti, quand le 5 garde des émotions intenses mais privées et pénètre les choses par l'intellect."}, {"avec": 9, "distinguer": "Tous deux sont discrets ; mais la pensée du 9 est large et simplifie, celle du 5 est pointue, technique et complexifie. Le 9 accueille, le 5 tient à distance."}, {"avec": 1, "distinguer": "Tous deux sont sérieux et cérébraux ; mais le 1 veut des idées qui mènent à l'action et vit dans la certitude, le 5 peut s'absorber dans des idées sans application et vit dans le doute."}, {"avec": 6, "distinguer": "Le 5 se fie à son propre jugement ; le 6 cherche une référence extérieure (autorité, procédure, source) pour se rassurer."}]}, "sources": "H. Palmer, P. et F. Chabreuil, B. Chestnut, D. Riso et R. Hudson, G. Lapid-Bogda, D. Daniels et V. Price, T. Condon et C. Thomson"}, {"n": 6, "nom": "Le Loyaliste", "alias": "le Loyal-sceptique, l'Avocat du diable, le Gardien", "centre": "tete", "devise": "Le monde est menaçant.", "enUnMot": "Se sentir en sécurité et soutenu : un cadre fiable, une hiérarchie juste et cohérente, une équipe loyale, des risques anticipés.", "voit": "Là où d'autres voient une belle idée, il voit d'abord ce qui pourrait mal tourner : le délai trop court, la faille du raisonnement, l'intention cachée. Pour lui, examiner les risques relève de la simple conscience professionnelle (Chabreuil).", "apporte": ["L'anticipation des risques et la préparation de plans de secours.", "Les questions que personne n'ose poser.", "Une loyauté et une fiabilité à toute épreuve quand il a confiance.", "Le souci de souder l'équipe et de défendre les plus fragiles ; un vrai sang-froid dans la crise réelle."], "pieges": ["Analyser sans fin et tarder à décider, surtout quand tout va bien.", "Voir des dangers ou des intentions cachées qui n'existent pas.", "Osciller face à la hiérarchie entre soumission et rébellion.", "Freiner sa propre réussite : être en vue, c'est devenir une cible."], "stress": {"vers": 3, "resume": "Sous forte pression, il a tendance à se jeter dans le travail et à soigner son image pour se rassurer, comme un 3 sous stress.", "signes": ["Il enchaîne les tâches sans répit, alternant coups d'accélérateur et coups de frein.", "Il devient compétitif et cherche à paraître irréprochable.", "Il finit épuisé quand l'adrénaline retombe."]}, "confiance": {"vers": 9, "resume": "En confiance, il se détend et fait confiance au processus, comme un 9 en bonne forme.", "signes": ["Il cesse de tout questionner et accepte d'autres points de vue.", "Il perçoit la bonne volonté des autres comme réelle, et non comme un piège.", "Il aborde les décisions avec plus de calme et de stabilité."]}, "niveaux": {"bien": "Il trouve en lui son propre guide : solide, fiable et serein, il fait confiance aux autres et s'engage pour le bien commun. Ses questions deviennent un remarquable pouvoir de discernement.", "moyen": "Loyal et dévoué, mais anxieux, il cherche des garanties dans les règles et la hiérarchie. Il hésite et ses « Oui, mais… » peuvent épuiser l'équipe.", "mal": "Il se sent trahi, accuse et voit des ennemis partout. Il se fige, ou attaque avant d'être attaqué, et peut entraîner son entourage dans son anxiété."}, "communiquer": {"style": "Il parle beaucoup par questions et réserves : « Oui, mais… et si ? ». H. Palmer souligne que la cohérence compte avant tout pour lui : il veut savoir ce que l'on pense vraiment, car cela calme ses doutes.", "faire": ["Être fiable et cohérent : il vérifie que vos actes suivent vos paroles.", "Prendre ses questions au sérieux, sans chercher à le dissuader d'avoir peur.", "Annoncer les mauvaises nouvelles tôt et franchement.", "Expliquer les changements et lui laisser le temps de s'adapter."], "eviter": ["Balayer ses inquiétudes : « Tu t'inquiètes pour rien. »", "Les doubles messages, les non-dits et le favoritisme.", "La critique devant les autres et l'autorité brutale."]}, "scene": {"titre": "Le nouveau logiciel", "texte": "Sophie, gestionnaire des ressources humaines, apprend que le logiciel de paie change dans un mois. Elle pose une série de questions : les sauvegardes, la formation, qui appeler en cas de panne. Son responsable la trouve négative. Une fois les réponses obtenues, elle devient la personne la plus fiable de l'équipe pour la bascule."}, "approfondir": {"communication": {"parle": "Il formule ses doutes et ses mises en garde avec franchise, parfois avec un humour un peu grinçant. Il teste les arguments en prenant le point de vue opposé. Sa prudence est souvent entendue comme du pessimisme ou de l'hostilité.", "ecoute": "Il écoute surtout la cohérence entre ce qui est dit et ce qui est fait, et cherche ce que les mots pourraient cacher. Il se méfie des compliments trop appuyés et des messages ambigus.", "signauxPositifs": ["Loyal et fiable (Palmer).", "Esprit inquisiteur qui repère les problèmes à l'avance (Palmer).", "Bon stratège, au sens politique aigu, qui mesure les conséquences d'une décision (Palmer)."], "signauxNegatifs": ["Un questionnement permanent qui paraît négatif ; les « Oui, mais » épuisent (Palmer).", "Une vigilance qui peut virer à la suspicion et prêter aux autres des intentions hostiles (Palmer).", "Sous pression, il peut entraîner les autres dans une spirale d'anxiété (Palmer)."], "retour": ["Toujours en privé, jamais devant l'équipe.", "Commencer par ce qui va, puis des points précis à améliorer ; l'éloge excessif sonne faux.", "Dire clairement ce qui est attendu, pour qu'il n'ait pas à deviner."], "tension": ["Reconnaître la part fondée de son inquiétude avant de répondre.", "Donner des faits, des garanties concrètes et un calendrier.", "Rester calme et constant : une réponse stable le rassure plus qu'une grande déclaration."], "canal": "L'échange direct et franc, en face à face, complété d'un écrit qui fixe les engagements. L'oral lui permet de poser ses questions ; l'écrit lui donne la garantie que ce qui a été dit tiendra."}, "progresser": {"forces": ["Une parole honnête, qui ose dire ce qui pose problème.", "Une attention réelle aux plus fragiles de l'équipe.", "Le talent de repérer les problèmes avant qu'ils n'éclatent (Chestnut)."], "pistes": ["Accompagner chaque risque signalé d'une solution proposée.", "Lister aussi les points positifs d'un projet.", "Vérifier les faits en posant la question plutôt qu'imaginer les intentions.", "Se demander avant de parler : « Est-ce une intuition, ou ma peur que je prête aux autres ? »"]}, "stressDetail": {"paliers": ["Une impression de danger sans fondement réel : il imagine le pire.", "Il vérifie tout, cherche des garanties, réclame des consignes écrites.", "Il doute de tout, remet à plus tard et ne décide plus.", "Il se fige ou passe à l'attaque : il accuse, s'oppose au changement.", "Il se jette dans l'action sans répit, jusqu'à l'épuisement."], "revenir": ["Une information franche, même mauvaise.", "Un cadre clair, avec des rôles et des objectifs définis.", "Un responsable bienveillant et cohérent, qui tient parole."]}, "ailes": [{"aile": 5, "nom": "Le Défenseur", "texte": "Plus sérieux, réservé et indépendant ; il se rassure par le savoir et les systèmes, et défend volontiers une cause."}, {"aile": 7, "nom": "Le Copain", "texte": "Plus enjoué, sociable et plein d'humour ; il cherche l'appartenance au groupe et se montre plus léger."}], "instincts": {"conservation": {"nom": "Chaleur", "texte": "Chaleureux et attentif à son équipe, il pose beaucoup de questions et n'a jamais assez de preuves pour trancher. Il reste calme dans la crise."}, "social": {"nom": "Devoir", "texte": "Gardien du cadre, il s'appuie sur les procédures, les rôles et les règles. Rationnel et efficace, il peut ressembler à un 1."}, "teteATete": {"nom": "Force/Beauté", "texte": "Le plus affirmé : il prend le contre-pied de l'avis dominant, aime le risque et bouscule l'équipe. Il peut ressembler à un 8."}}, "manager": {"planifier": {"force": "Il met en place des procédures efficaces et des circuits de décision clairs.", "angle": "Il se replie sur les règles, s'attarde sur les détails, se montre trop ou pas assez directif."}, "decider": {"force": "Il explore tous les scénarios et prévoit des plans de secours.", "angle": "Le doute le fait tourner en rond ; quand tout va bien, ses décisions tardent."}, "deleguer": {"force": "Il délègue sans peine et travaille comme un membre de l'équipe.", "angle": "S'il n'est pas informé à temps et honnêtement, il perd confiance, souvent pour longtemps."}, "retour": {"force": "Franc et honnête, il crédite les autres de leurs réussites.", "angle": "Sous tension, il prend un ton accusateur et pointe du doigt."}, "conflit": {"force": "Dans la vraie difficulté, il se surpasse : ténacité, clarté, énergie.", "angle": "Peu à l'aise dans le conflit, il recule, ou cherche à écarter les récalcitrants ; il craint l'insubordination (Palmer)."}}, "besoins": {"donne": ["Des consignes claires et un responsable digne de confiance.", "Être informé franchement, même des mauvaises nouvelles.", "Une équipe soudée, sans compétition interne.", "Une cause à défendre et du temps pour analyser."], "prend": ["Des tâches et des responsabilités floues.", "Des règles changées brutalement, sans explication.", "Les clans, le favoritisme, les doubles messages.", "Un pouvoir brutal ou une critique devant tout le monde."]}, "diriger": ["Définir clairement tâches, rôles et attentes, et éviter les surprises.", "Tenir parole et rester cohérent dans la durée : sa loyauté en dépend.", "Utiliser ses doutes comme un outil pour repérer les failles d'un projet, puis l'aider à s'engager.", "L'encourager en privé et l'aider à reconnaître ses propres réussites."], "confusions": [{"avec": 1, "distinguer": "Tous deux respectent les règles ; mais le 1 est sûr de son opinion et la défend, le 6 doute et cherche une autorité extérieure pour se rassurer."}, {"avec": 8, "distinguer": "Le 6 contre-phobique peut paraître aussi combatif qu'un 8 ; mais sous pression, le 6 finit par céder, alors que le 8 redouble de force quand on lui résiste."}, {"avec": 9, "distinguer": "Tous deux tiennent à la stabilité ; mais le 9 reste imperturbable, alors que le 6 montre ses doutes et a besoin d'en parler pour s'en décharger."}, {"avec": 5, "distinguer": "Le 6 se méfie de son propre jugement et s'appuie sur des références et des procédures ; le 5 fait confiance à son esprit et s'en tient à son analyse."}]}, "sources": "H. Palmer, P. et F. Chabreuil, B. Chestnut, D. Riso et R. Hudson, G. Lapid-Bogda, D. Daniels et V. Price, M. Bradel"}, {"n": 7, "nom": "L'Épicurien", "alias": "l'Enthousiaste, l'Optimiste, l'Aventurier", "centre": "tete", "devise": "Le monde offre plein de possibilités et de choix.", "enUnMot": "Des projets neufs, de la variété et de la liberté, pour garder l'élan et ne pas se sentir enfermé dans l'ennui, la contrainte ou ce qui fait mal.", "voit": "Là où d'autres voient un problème, il voit des possibilités : de nouvelles pistes, des liens entre des domaines éloignés, un avenir prometteur. G. Lapid-Bogda parle d'un « esprit de synthèse » très rapide.", "apporte": ["Des idées en nombre, des pistes nouvelles, des liens inattendus entre les domaines.", "Du moral et de l'énergie pour toute l'équipe.", "Une grande rapidité d'apprentissage et la capacité de mener plusieurs missions de front.", "Le rebond quand tout bloque, et le talent de « vendre » un projet."], "pieges": ["Préférer concevoir que réaliser : la fin d'un projet l'ennuie.", "Sous-estimer le temps nécessaire et compter sur le coup de collier final.", "Écarter les risques, et voir en trouble-fête ceux qui les signalent.", "Éviter les conflits et présenter ses erreurs sous un jour positif au lieu de les reconnaître."], "stress": {"vers": 1, "resume": "Sous forte pression, sa légèreté tombe et il a tendance à devenir critique et rigide, comme un 1 sous stress.", "signes": ["Il devient impatient, cassant, sermonneur.", "Il pinaille ou ironise sur le travail des autres.", "Il se compare et se plaint de ce dont on le prive."]}, "confiance": {"vers": 5, "resume": "En confiance, il ralentit et approfondit, comme un 5 en bonne forme.", "signes": ["Il se concentre sur un seul projet et va jusqu'au bout.", "Il observe et écoute avant de proposer.", "Il se demande ce qui compte vraiment et fait des choix nets."]}, "niveaux": {"bien": "Présent, reconnaissant, il reste créatif et va au bout de ce qu'il entreprend. Il est alors réaliste, productif et travailleur (Riso et Hudson).", "moyen": "Toujours occupé, il saute d'un projet à l'autre et fuit l'ennui et les sujets pesants. Une impatience couve sous sa bonne humeur, et ses engagements glissent.", "mal": "Impulsif et excessif, il fuit à tout prix : il change de cap, abandonne ou cherche une issue ailleurs. Il alterne euphorie et abattement, et l'équipe ne suit plus."}, "communiquer": {"style": "Il parle vite, avec enthousiasme, par anecdotes, plaisanteries et projets, et passe volontiers d'une idée à l'autre. H. Palmer en fait de grands communicateurs dont l'enthousiasme est contagieux ; il change de sujet quand la conversation devient lourde.", "faire": ["Garder un ton positif et lui laisser de l'espace pour imaginer.", "Accueillir ses idées, puis l'aider à distinguer une piste d'un engagement.", "Fixer avec lui des échéances réalistes et des points d'étape.", "Prendre au sérieux ce qu'il apporte, au-delà de sa bonne humeur."], "eviter": ["La surveillance pas à pas et les « non, on ne peut pas » sans explication.", "Les réunions qui traînent et les plaintes sans solution.", "La critique en public, ou qui devient personnelle."]}, "scene": {"titre": "Le séminaire", "texte": "Thomas, commercial, lance en réunion trois idées pour le séminaire annuel, dont une journée en voilier. Son enthousiasme entraîne tout le monde. Deux semaines plus tard, l'organisation concrète n'a pas avancé : il est déjà passé à un autre projet."}, "approfondir": {"communication": {"parle": "Il raconte, relie, plaisante et projette ; sa parole ouvre des possibles et donne envie. Il recadre volontiers le négatif en positif. Sa légèreté peut être perçue comme un manque de sérieux ou d'engagement.", "ecoute": "Il entend surtout les possibilités, les ouvertures et ce qui donne de l'élan. Il filtre les mauvaises nouvelles, les contraintes et les sujets douloureux, qu'il remet volontiers à plus tard.", "signauxPositifs": ["Un enthousiasme contagieux et beaucoup de créativité (Palmer).", "Le talent de relier des idées entre elles, avec optimisme (Palmer).", "Il aide les autres à voir les possibilités (Palmer)."], "signauxNegatifs": ["Une inconstance qui déroute (Palmer).", "La difficulté à finir ce qu'il commence (Palmer).", "L'évitement de ce qui fait mal, vécu comme un manque d'engagement par les collègues (Palmer)."], "retour": ["En privé, sur un fait précis, avec une suite constructive.", "Reconnaître d'abord ce qu'il a apporté, puis nommer clairement ce qui ne va pas.", "Ne pas le laisser détourner la conversation : revenir calmement au point."], "tension": ["Accueillir son humour sans perdre le fil du sujet.", "Proposer des solutions concrètes plutôt que de rester dans la plainte.", "Si nécessaire, poser une limite ferme et claire : Palmer note qu'un rappel net à la réalité peut l'aider."], "canal": "L'échange oral, vi
