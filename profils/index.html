<style>
:root{
  --fond:#f6f4f0; --carte:#ffffff; --encre:#1d1b19; --doux:#5f5a54; --pale:#8b857d; --trait:#e7e2da; --trait2:#d8d1c6;

    --vert:#6cc48f; --vert-f:#1a2e22; --rouge:#f28b82; --rouge-f:#3a1f1d; --ambre:#e8b84a; --ambre-f:#342a14;
    --ombre:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
    --fond:#141312; --carte:#1e1c1a; --encre:#f1ede7; --doux:#b9b2a8; --pale:#8d867d; --trait:#2e2b28; --trait2:#3b3733;
    --coeur:#f06292; --coeur-f:#3a1d29; --ventre:#f0a43a; --ventre-f:#38291a; --tete:#6fa3f0; --tete-f:#1b2638;
    --vert:#6cc48f; --vert-f:#1a2e22; --rouge:#f28b82; --rouge-f:#3a1f1d; --ambre:#e8b84a; --ambre-f:#342a14;
    --ombre:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25);

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fond);color:var(--encre);font:16px/1.55 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:inherit}
.barre{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:color-mix(in srgb,var(--fond) 86%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--trait)}
.retour{display:none;align-items:center;gap:6px;border:0;background:var(--carte);box-shadow:var(--ombre);border-radius:999px;padding:7px 14px 7px 10px;font-weight:600;font-size:15px;cursor:pointer}
.retour.vu{display:inline-flex}
.barre .titre{font-weight:600;font-size:15px;color:var(--doux);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.accueil-btn{border:0;background:none;cursor:pointer;padding:6px;border-radius:10px;color:var(--doux)}
main{max-width:760px;margin:0 auto;padding:18px 16px 80px}
.vue{animation:entre .32s cubic-bezier(.2,.7,.2,1)}

@keyframes entre{from{transform:translateY(10px)}to{transform:none}}

.c-coeur{--c:var(--coeur);--cf:var(--coeur-f)} .c-ventre{--c:var(--ventre);--cf:var(--ventre-f)} .c-tete{--c:var(--tete);--cf:var(--tete-f)}

.etiq{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--cf,var(--trait));color:var(--c,var(--doux));letter-spacing:.02em}

.tete-fiche .devise{font-family:Fraunces,serif;font-size:19px;margin:10px 0 6px;font-style:italic}
.dyn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dyn .d{border-radius:16px;padding:14px;background:var(--carte);box-shadow:var(--ombre)}
.dyn .d .k{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em}

.dyn .vers .puce{width:28px;height:28px;font-size:13px}
.dyn p{font-size:14.5px;margin:0;color:var(--doux)}
.jauge{display:grid;gap:8px}
.jauge .n{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:start;padding:10px 12px;border-radius:12px}
.jauge .n b{font-size:13px}
.jauge .n p{margin:0;font-size:14.5px}
.n.bien{background:var(--vert-f)} .n.bien b{color:var(--vert)}
.n.moyen{background:var(--ambre-f)} .n.moyen b{color:var(--ambre)}
.n.mal{background:var(--rouge-f)} .n.mal b{color:var(--rouge)}
.scene{border-left:4px solid var(--c);padding:4px 0 4px 16px;margin:6px 0}
.scene .t{font-weight:700;margin-bottom:4px}
.scene p{font-style:italic;color:var(--doux)}
.deux{display:grid;gap:12px}
@media(min-width:620px){.deux{grid-template-columns:1fr 1fr}}
.duo-mini{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.duo-mini button{border:0;cursor:pointer;padding:0;background:none}
/* tableau */
.tab{width:100%;border-collapse:separate;border-spacing:0;font-size:14.5px}
.tab td,.tab th{padding:10px;border-bottom:1px solid var(--trait);vertical-align:top;text-align:left}
.tab th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--pale)}
.ligne-type{cursor:pointer}
.mat{display:grid;grid-template-columns:28px repeat(9,1fr);gap:4px;max-width:520px;margin:0 auto}
.mat .h{display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--pale)}
.mat button{aspect-ratio:1;border:0;border-radius:8px;cursor:pointer;font-size:11px;font-weight:600;background:var(--trait);color:var(--doux)}
.mat button:hover{background:var(--encre);color:var(--fond)}
.mat button.sel{background:var(--encre);color:var(--fond)}
/* test */
.q{padding:14px 0;border-top:1px solid var(--trait)}
.q p{margin:0 0 10px;font-weight:500}
.echelle{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.echelle button{border:1px solid var(--trait2);background:var(--carte);border-radius:10px;padding:9px 0;cursor:pointer;font-weight:600;font-size:14px}
.echelle button.on{background:var(--encre);color:var(--fond);border-color:var(--encre)}
.echelle-leg{display:flex;justify-content:space-between;font-size:12px;color:var(--pale);margin-top:4px}
.progress{height:6px;border-radius:9px;background:var(--trait);overflow:hidden;margin:10px 0}
.progress i{display:block;height:100%;background:var(--encre);transition:width .3s}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:12px;padding:12px 18px;background:var(--encre);color:var(--fond);font-weight:600;cursor:pointer}
.btn.sec{background:var(--trait);color:var(--encre)}
.barre-res{display:grid;grid-template-columns:150px 1fr 34px;gap:10px;align-items:center;margin:6px 0;font-size:14px}
.barre-res .b{height:10px;border-radius:9px;background:var(--trait);overflow:hidden}
.barre-res .b i{display:block;height:100%;background:var(--c)}
.pied{margin-top:40px;padding-top:16px;border-top:1px solid var(--trait);font-size:13px;color:var(--pale)}
.theme{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));border:0;width:42px;height:42px;border-radius:50%;background:var(--carte);box-shadow:var(--ombre);cursor:pointer;font-size:18px}
@media (max-width:480px){
  .jauge .n{grid-template-columns:1fr;gap:2px}
  .dyn .vers span:last-child{font-size:14px;line-height:1.2}
  .dyn .d{padding:12px}
  .carte{padding:16px}
  .carte-centre{padding:14px 16px}
  .carte-centre .mot{font-size:20px}
  .tab{font-size:13.5px}.tab td,.tab th{padding:8px 6px}
  .barre-res{grid-template-columns:118px 1fr 30px;font-size:13px}
}
.chev{font-size:22px;color:var(--pale);line-height:1}
.ic-c{width:10px;height:38px;border-radius:6px;flex:none}
.mini{display:flex;align-items:center;gap:16px;padding:12px 16px}
.mini svg{width:150px;flex:none}
.mini .leg{display:grid;gap:8px;font-size:14px;font-weight:600}
.mini .leg i{display:inline-block;width:18px;height:4px;border-radius:2px;margin-right:8px;vertical-align:middle}
.intro{text-align:center;padding-top:6px}
.intro .sur{margin-bottom:6px}
.grand-cercle{display:block;width:100%;max-width:460px;margin:4px auto 0;touch-action:manipulation}
.grand-cercle .noeud{cursor:pointer;transition:opacity .25s}
.grand-cercle .trace{stroke-dasharray:240;stroke-dashoffset:240;animation:trace .5s ease-out forwards}
@keyframes trace{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.grand-cercle .trace{animation:none;stroke-dashoffset:0}}
.legende{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;font-size:13.5px;font-weight:600;color:var(--doux)}
.legende i,.fl2 i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.fl2 i{width:18px;height:4px;border-radius:2px}
.choix{animation:entre .3s cubic-bezier(.2,.7,.2,1)}
.fl2{display:grid;gap:6px;margin-top:14px;padding-top:12px;border-top:1px solid var(--trait);font-size:14.5px}
.bandeau.court{margin-top:22px}
.menu-btn{display:inline-flex;align-items:center;gap:7px;border:0;background:var(--carte);box-shadow:var(--ombre);border-radius:999px;padding:8px 14px;font-weight:600;font-size:15px;cursor:pointer}
.voile{position:fixed;inset:0;background:rgba(20,16,12,.32);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.feuille{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:86vh;overflow:auto;background:var(--fond);border-radius:22px 22px 0 0;padding:10px 16px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.7,.2,1);box-shadow:0 -10px 40px rgba(0,0,0,.18)}
@media(min-width:700px){.feuille{left:auto;top:0;bottom:0;width:380px;max-height:none;border-radius:0;transform:translateX(105%);padding-top:calc(18px + env(safe-area-inset-top))}}
.menu-ouvert .voile{opacity:1;pointer-events:auto}
.menu-ouvert .feuille{transform:none}
.poignee{width:42px;height:5px;border-radius:9px;background:var(--trait2);margin:2px auto 12px}
@media(min-width:700px){.poignee{display:none}}
.m-lien{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:var(--carte);border-radius:14px;padding:13px 16px;margin:6px 0;cursor:pointer;box-shadow:var(--ombre)}
.m-lien span:first-child{flex:1}.m-lien small{display:block;color:var(--pale);font-size:13px}
.m-lien.ici{outline:2px solid var(--encre)}
.grille-types{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.pastille{display:flex;align-items:center;gap:8px;width:100%;border:0;background:var(--carte);box-shadow:var(--ombre);border-radius:14px;padding:9px 10px;margin:0 0 8px;cursor:pointer;font-weight:600;font-size:14px;text-align:left;transition:transform .15s}
.pastille:hover{transform:translateY(-1px)}
.pastille .puce{width:28px;height:28px;font-size:13px}
.pastille span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pastille.ici{outline:2px solid var(--c)}
.grille-types .pastille{margin:0;flex-direction:column;gap:5px;padding:10px 4px;font-size:12.5px}
.trois-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.trois-col .sur{font-size:11px}
@media(max-width:480px){.trois-col .pastille{flex-direction:column;gap:5px;padding:10px 4px;font-size:12.5px;text-align:center}.trois-col .pastille span:last-child{white-space:normal}}
.fil{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;color:var(--pale);margin:0 0 10px}
.fil a{color:var(--doux);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--trait2);cursor:pointer}
.fil b{color:var(--encre);font-weight:600}
.choix-type{display:flex;gap:5px;overflow-x:auto;padding:2px 0 12px;margin-bottom:4px;scrollbar-width:none}
.choix-type::-webkit-scrollbar{display:none}
.choix-type button{flex:none;width:32px;height:32px;border-radius:50%;border:1.5px solid var(--c);background:transparent;color:var(--c);font-weight:700;font-size:14px;cursor:pointer}
.choix-type button.ici{background:var(--c);color:#fff}
.grand-cercle .halo{opacity:0;transform-box:fill-box;transform-origin:center;animation:halo 1.6s ease-out 2}
@keyframes halo{0%{opacity:.5;transform:scale(1)}100%{opacity:0;transform:scale(2.1)}}
.grand-cercle .noeud:hover .pastille-c{transform:scale(1.12)}
.grand-cercle .pastille-c{transition:transform .18s}
.grand-cercle .invite{animation:invite 2.4s ease-in-out infinite}
@keyframes invite{0%,100%{opacity:1}50%{opacity:.55}}
@media (prefers-reduced-motion: reduce){.grand-cercle .halo,.grand-cercle .invite{animation:none}}
@media(max-width:480px){.retour.vu ~ .titre{visibility:hidden}}
@media print{.barre,.theme,.plus{display:none}}
</style>

</header>
<div class="voile" id="voile"></div>

<main id="app"></main>

<script>
const TYPES = [];
const DUOS = {};
</script>
<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const T = n => TYPES.find(t => t.n === +n);
const CENTRE_DE = {1:"ventre",2:"coeur",3:"coeur",4:"coeur",5:"tete",6:"tete",7:"tete",8:"ventre",9:"ventre"};
const STRESS = {1:4,2:8,3:9,4:2,5:7,6:3,7:1,8:5,9:6};
const CONF   = {1:7,2:4,3:6,4:1,5:8,6:9,7:5,8:2,9:3};
const puce = (n, cls="") => `<span class="puce c-${CENTRE_DE[n]} ${cls}">${n}</span>`;
const nomT = n => T(n) ? T(n).nom : "Type " + n;

const CENTRES = {
  coeur: {
    nom: "L'intelligence émotionnelle", court: "émotionnelle", types: [3,2,4], mot: "L'image et le lien",
    emotion: "Sous la surface : la honte ou la tristesse",
    cherche: "Ils cherchent l'attention : être vus, reconnus, appréciés pour ce qu'ils apportent.",
    capte: "En entrant en réunion, ils captent l'ambiance, les regards, ce que l'on attend d'eux.",
    besoin: "D'un responsable, ils attendent d'abord de la considération : une reconnaissance précise, personnelle, sincère.",
    annonce: "Présentez le changement par ce qu'il permet de réussir et par la place que chacun y tiendra. Remerciez nommément.",
    trois: [[2,"Tourné vers les autres : leurs besoins passent avant les siens."],[3,"Tourné vers le résultat : il met ses émotions de côté pour réussir."],[4,"Tourné vers son ressenti : il cherche l'authentique et le sens."]],
    scene: ["Une entreprise annonce une réorganisation des équipes.", "Léa, assistante, cherche aussitôt comment soutenir le collègue dont le poste change. Antoine, chef de projet, voit déjà le calendrier et ce qu'il pourra présenter à la direction. Sarah, rédactrice, se demande si cette réorganisation a vraiment du sens, ou si c'est une vitrine de plus."]
  },
  ventre: {
    nom: "L'intelligence instinctive", court: "instinctive", types: [8,9,1], mot: "L'autonomie et le cadre",

const ROUTES = [];

function rendre(){
  const h = location.hash.replace(/^#/, "") || "/";
  for (const [re, fn] of ROUTES){
    const m = h.match(re);
    if (m){
      const r = fn(...m.slice(1));
      fermerMenu();
      $("#app").innerHTML = `${fil(h)}<div class="vue">${r.html}</div>${pied()}`;
      $("#titre").textContent = r.titre || "Les neuf profils au travail";

      $("#retour").classList.toggle("vu", h !== "/");
      const y = lireScroll(h);
      window.scrollTo(0, y);
      if (r.apres) r.apres();

    }
  }
  aller("/");
}
const memo = {};
function lireScroll(h){ try { return +(sessionStorage.getItem("sc:" + h) || memo[h] || 0); } catch(e){ return memo[h] || 0; } }

window.addEventListener("scroll", () => { clearTimeout(window._st); window._st = setTimeout(noterScroll, 120); }, {passive:true});

function fil(h){

/* ---------- Cercle ---------- */
function cercle(opts={}){
  const R = 140, cx = 180, cy = 180;
  const pos = n => { const a = (n % 9) * 40 * Math.PI / 180; return [cx + R * Math.sin(a), cy - R * Math.cos(a)]; };
  let fl = "";
  if (opts.fleches){
    const seq = [[1,4],[4,2],[2,8],[8,5],[5,7],[7,1],[3,9],[9,6],[6,3]];
    fl = seq.map(([a,b]) => { const [x1,y1]=pos(a),[x2,y2]=pos(b); const k=0.83; const xe=x1+(x2-x1)*k, ye=y1+(y2-y1)*k; const xs=x1+(x2-x1)*0.17, ys=y1+(y2-y1)*0.17; return `<line x1="${xs}" y1="${ys}" x2="${xe}" y2="${ye}" stroke="var(--rouge)" stroke-width="1.6" marker-end="url(#fl)" opacity=".75"/>`; }).join("");
  } else {
    const seq = [[1,4],[4,2],[2,8],[8,5],[5,7],[7,1],[3,9],[9,6],[6,3]];
    fl = seq.map(([a,b]) => { const [x1,y1]=pos(a),[x2,y2]=pos(b); return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--trait2)" stroke-width="1.2"/>`; }).join("");
  }
  const noeuds = [1,2,3,4,5,6,7,8,9].map(n => { const [x,y]=pos(n); const t=T(n); const lx = cx + (R+0) * Math.sin((n%9)*40*Math.PI/180); return `<g class="noeud" data-go="/type/${n}" role="link" aria-label="Type ${n}"><circle cx="${x}" cy="${y}" r="21" fill="var(--${CENTRE_DE[n]})"/><text x="${x}" y="${y+6}" text-anchor="middle" font-family="Inter" font-weight="700" font-size="17" fill="#fff">${n}</text></g>`; }).join("");
  const noms = opts.noms ? [1,2,3,4,5,6,7,8,9].map(n => { const a=(n%9)*40*Math.PI/180; const x=cx+(R+38)*Math.sin(a), y=cy-(R+38)*Math.cos(a)+4; const anc = Math.abs(Math.sin(a))<.2?"middle":(Math.sin(a)>0?"start":"end"); return `<text x="${x}" y="${y}" text-anchor="${anc}" font-size="11.5" font-weight="600" fill="var(--doux)">${esc((T(n)||{}).nom||"").replace(/^(Le |L')/,"")}</text>`; }).join("") : "";
  return `<svg class="cercle" viewBox="-40 -10 440 380" aria-label="Le cercle des neuf types"><defs><marker id="fl" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--rouge)"/></marker></defs><circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="var(--trait2)" stroke-width="1.5"/>${fl}${noeuds}${noms}</svg>`;
}

function miniFleches(n, t){
  const R = 70, cx = 100, cy = 92;
  const pos = k => { const a = (k % 9) * 40 * Math.PI / 180; return [cx + R * Math.sin(a), cy - R * Math.cos(a)]; };
  const fl = (a, b, col, id) => { const [x1,y1]=pos(a),[x2,y2]=pos(b); const d=Math.hypot(x2-x1,y2-y1); const ux=(x2-x1)/d, uy=(y2-y1)/d; return `<line x1="${x1+ux*15}" y1="${y1+uy*15}" x2="${x2-ux*17}" y2="${y2-uy*17}" stroke="${col}" stroke-width="2.4" marker-end="url(#${id})"/>`; };
  const s = t.stress.vers, k = t.confiance.vers;
  const nds = [1,2,3,4,5,6,7,8,9].map(m => { const [x,y]=pos(m); const actif = m===n||m===s||m===k; const fill = m===n ? `var(--${CENTRE_DE[m]})` : m===s ? "var(--rouge)" : m===k ? "var(--vert)" : "var(--carte)"; return `<circle cx="${x}" cy="${y}" r="${m===n?14:12}" fill="${fill}" stroke="${actif?"none":"var(--trait2)"}"/><text x="${x}" y="${y+4.5}" text-anchor="middle" font-family="Inter" font-weight="700" font-size="${m===n?14:12}" fill="${actif?"#fff":"var(--pale)"}">${m}</text>`; }).join("");
  return `<div class="carte mini"><svg viewBox="0 0 200 184" aria-label="Directions de stress et de confiance du ${n}"><defs><marker id="mr${n}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--rouge)"/></marker><marker id="mv${n}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--vert)"/></marker></defs><circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="var(--trait)" stroke-width="1.2"/>${fl(n,s,"var(--rouge)","mr"+n)}${fl(n,k,"var(--vert)","mv"+n)}${nds}</svg><div class="leg"><span><i style="background:var(--rouge)"></i>Sous stress → ${s}</span><span><i style="background:var(--vert)"></i>En confiance → ${k}</span></div></div>`;
}

/* ---------- Accueil ---------- */
function grandCercle(sel){
  const R = 128, cx = 180, cy = 168;
  const pos = (n, r=R) => { const a = (n % 9) * 40 * Math.PI / 180; return [cx + r * Math.sin(a), cy - r * Math.cos(a)]; };
  const seq = [[1,4],[4,2],[2,8],[8,5],[5,7],[7,1],[3,9],[9,6],[6,3]];
  const lignes = seq.map(([a,b]) => { const [x1,y1]=pos(a),[x2,y2]=pos(b); return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--trait2)" stroke-width="1" opacity="${sel?.35:1}"/>`; }).join("");
  let fl = "";
  if (sel){
    const t = T(sel); const f = (a, b, col, id) => { const [x1,y1]=pos(a),[x2,y2]=pos(b); const d=Math.hypot(x2-x1,y2-y1); const ux=(x2-x1)/d, uy=(y2-y1)/d; return `<line class="trace" x1="${x1+ux*25}" y1="${y1+uy*25}" x2="${x2-ux*27}" y2="${y2-uy*27}" stroke="${col}" stroke-width="2.6" stroke-linecap="round" marker-end="url(#${id})"/>`; };
    fl = f(sel, t.stress.vers, "var(--rouge)", "gr") + f(sel, t.confiance.vers, "var(--vert)", "gv");
  }
  const nds = [1,2,3,4,5,6,7,8,9].map(n => { const [x,y]=pos(n); const on = n===sel; const dim = sel && !on && n!==T(sel).stress.vers && n!==T(sel).confiance.vers; const nm = esc((T(n)||{}).nom||"").replace(/^(Le |L')/,""); const delai = ((n % 9) * 0.12).toFixed(2); const a=(n%9)*40*Math.PI/180; const [lx,ly]=pos(n,R+40); const anc=Math.abs(Math.sin(a))<.2?"middle":(Math.sin(a)>0?"start":"end");
    return `<g class="noeud${on?" on":""}" data-sel="${n}" role="button" aria-label="Type ${n}, ${nm}" style="opacity:${dim?.45:1}"><circle cx="${x}" cy="${y}" r="30" fill="transparent"/>${sel?"":`<circle class="halo" cx="${x}" cy="${y}" r="21" fill="var(--${CENTRE_DE[n]})" style="animation-delay:${delai}s"/>`}${on?`<circle cx="${x}" cy="${y}" r="29" fill="none" stroke="var(--${CENTRE_DE[n]})" stroke-width="2" opacity=".35"/>`:""}<circle class="pastille-c" cx="${x}" cy="${y}" r="${on?24:21}" fill="var(--${CENTRE_DE[n]})" style="transform-origin:${x}px ${y}px"/><text x="${x}" y="${y+6}" text-anchor="middle" font-family="Inter" font-weight="700" font-size="${on?19:17}" fill="#fff">${n}</text><text x="${lx}" y="${ly+4}" text-anchor="${anc}" font-size="13.5" font-weight="${on?700:600}" fill="var(--encre)" class="nom-c">${nm}</text></g>`; }).join("");
  const centre = sel ? "" : `<g class="invite"><g transform="translate(${cx-11} ${cy-46}) scale(.92)" fill="none" stroke="var(--encre)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11V4.5a2 2 0 0 1 4 0V10"/><path d="M13 9.5a2 2 0 0 1 4 0V11"/><path d="M17 10.5a2 2 0 0 1 4 0V15a7 7 0 0 1-7 7h-1.2a6 6 0 0 1-4.6-2.2L4.4 16a1.9 1.9 0 0 1 2.8-2.6L9 15"/></g><text x="${cx}" y="${cy+8}" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="19" font-weight="650" fill="var(--encre)">Touchez</text><text x="${cx}" y="${cy+30}" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="19" font-weight="650" fill="var(--encre)">un profil</text></g>`;
  return `<svg class="grand-cercle" viewBox="-50 -12 460 360"><defs><marker id="gr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--rouge)"/></marker><marker id="gv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--vert)"/></marker></defs><circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="var(--trait2)" stroke-width="1.4"/>${lignes}${fl}${centre}${nds}</svg>`;
}

route(/^\/dynamique$/, () => ({ titre: "Ce qui fait bouger un profil", html: `
  <h1>Ce qui fait bouger un profil</h1>
  <p class="lead" style="margin-top:10px">Le profil de base reste le même ; tout le reste est en mouvement.</p>
  <div class="carte"><h3>1 · Les flèches : stress et confiance</h3><p>Sous stress, chacun prend certains travers d'un autre type ; en confiance, certaines qualités d'un autre encore. Les flèches rouges montrent la direction du stress ; la confiance suit le sens inverse.</p>${cercle({fleches:true})}
  <table class="tab"><tr><th>Type</th><th style="color:var(--rouge)">Sous stress</th><th style="color:var(--vert)">En confiance</th></tr>${[1,2,3,4,5,6,7,8,9].map(n=>`<tr class="ligne-type" data-go="/type/${n}/stress"><td>${puce(n)}</td><td>→ ${STRESS[n]} · ${esc(nomT(STRESS[n]))}</td><td>→ ${CONF[n]} · ${esc(nomT(CONF[n]))}</td></tr>`).join("")}</table>
  <p class="note">D'après D. Riso et R. Hudson, H. Palmer. Certains auteurs lisent ces lignes autrement.</p></div>
  <div class="carte"><h3>2 · Les niveaux : du meilleur au plus tendu</h3><p>Chaque type se vit à différents niveaux de liberté : sain, moyen, tendu. La plupart des gens vivent dans la zone moyenne. Chacun a un niveau habituel et une marge de variation : une journée difficile peut faire descendre de plusieurs crans, un succès faire remonter.</p><p class="note">Les niveaux mesurent la liberté intérieure du moment, pas l'intelligence ni la valeur. L'humeur n'est pas le niveau. (D. Riso et R. Hudson)</p>${plus("/etats","Les neuf, quand ça va et quand ça ne va pas")}</div>
  <div class="carte"><h3>3 · Les ailes : les voisins</h3><p>Chaque type est coloré par l'un de ses deux voisins sur le cercle. Un 3 « aile 2 » est plus chaleureux et tourné vers les gens ; un 3 « aile 4 » plus soucieux de son style, plus en retenue.</p></div>
  <div class="carte"><h3>4 · Les instincts : où se joue l'essentiel</h3>
    <div class="reac"><span class="etiq">Conservation</span><p>Sécurité, ressources, conditions de travail. En entrant dans une salle, il remarque le confort, l'organisation, la charge à venir.</p></div>
    <div class="reac"><span class="etiq">Social</span><p>La place dans le groupe, l'institution, les réseaux. En entrant, il perçoit qui a de l'influence, qui parle avec qui.</p></div>
    <div class="reac"><span class="etiq">Tête-à-tête</span><p>La relation directe, choisie, intense avec une personne. En entrant, il va vers l'interlocuteur qui compte.</p></div>
    <p class="note" style="margin-top:8px">Les trois vivent en chacun ; l'un domine, et il peut changer selon les périodes de la vie (B. Chestnut ; D. Riso et R. Hudson).</p></div>
  <div class="bandeau"><b>Ce que l'ennéagramme ne dit pas.</b> Il éclaire des motivations, souvent inconscientes. Il ne remplace ni la connaissance de la personne, ni sa psychologie, ni sa culture, ni son histoire. Il sert à mieux se comprendre et à mieux s'adresser aux autres, jamais à les classer.</div>`}));

  <div class="progress"><i id="prog" style="width:0"></i></div>
  <div class="carte" id="qs">
    ${ITEMS.map(([t,s],i) => `<div class="q"><p>${i+1}. ${esc(s)}</p><div class="echelle" data-i="${i}">${[1,2,3,4,5].map(v=>`<button data-v="${v}" class="${REP[i]==v?"on":""}">${v}</button>`).join("")}</div><div class="echelle-leg"><span>Pas du tout</span><span>Tout à fait</span></div></div>`).join("")}
  </div>
  <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" id="voir">Voir mes pistes</button><button class="btn sec" id="raz">Recommencer</button></div>
  <div id="res"></div>`,
  apres(){
    const maj = () => { $("#prog").style.width = (Object.keys(REP).length / ITEMS.length * 100) + "%"; };
    maj();
    $("#qs").addEventListener("click", e => { const b = e.target.closest("button[data-v]"); if(!b) return; const g = b.parentElement; REP[g.dataset.i] = +b.dataset.v; g.querySelectorAll("button").forEach(x => x.classList.toggle("on", x===b)); sauverRep(); maj(); });
    $("#raz").onclick = () => { REP = {}; sauverRep(); rendre(); };
    $("#voir").onclick = () => {
      const nb = Object.keys(REP).length;
      if (nb < 20){ $("#res").innerHTML = `<p class="note" style="margin-top:12px">Répondez à au moins 20 situations (${nb} pour l'instant).</p>`; return; }
      const sc = {}; for (let n=1;n<=9;n++) sc[n]=[0,0];
      ITEMS.forEach(([t],i) => { if (REP[i]) { sc[t][0]+=REP[i]; sc[t][1]++; } });
      const moy = Object.entries(sc).map(([n,[s,c]]) => [+n, c ? s/c : 0]).sort((a,b)=>b[1]-a[1]);
      const cen = {coeur:0,ventre:0,tete:0}; moy.forEach(([n,v]) => cen[CENTRE_DE[n]] += v);
      const cmax = Object.entries(cen).sort((a,b)=>b[1]-a[1])[0][0];
      $("#res").innerHTML = `<div class="carte" style="margin-top:16px"><h3>Vos pistes de lecture</h3><p class="note">Les trois profils qui ressortent le plus. Lisez-les, et surtout leur motivation : c'est elle qui permet de se reconnaître.</p>
        ${moy.slice(0,3).map(([n]) => `<button class="carte lien c-${CENTRE_DE[n]}" data-go="/type/${n}" style="margin:8px 0">${puce(n)}<span style="flex:1"><b>${esc(nomT(n))}</b><br><small class="note">${esc((T(n)||{}).enUnMot||"")}</small></span><span>›</span></button>`).join("")}
        <p style="margin-top:12px">Intelligence la plus marquée : <b>${CENTRES[cmax].nom}</b> · ${CENTRES[cmax].mot}.</p>
        <div style="margin-top:12px">${moy.map(([n,v]) => `<div class="barre-res c-${CENTRE_DE[n]}"><span>${n} · ${esc(nomT(n))}</span><div class="b"><i style="width:${(v-1)/4*100}%"></i></div><span class="note">${v.toFixed(1)}</span></div>`).join("")}</div>
        <p class="note" style="margin-top:12px">Vos réponses restent sur cet appareil ; elles ne sont envoyées nulle part.</p></div>`;
      $("#res").scrollIntoView({behavior:"smooth"});
    };
  }
}));

rendre();
</script>
</body>
</html>
