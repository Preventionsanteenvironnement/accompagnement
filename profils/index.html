vant et direct, qui laisse place aux idées, puis un écrit court qui fixe les échéances. L'oral nourrit son élan ; l'écrit l'aide à tenir ses engagements."}, "progresser": {"forces": ["Une parole enthousiaste qui mobilise.", "Le sens de la formule et de l'humour, qui détend.", "L'art de « vendre » un projet et de fédérer autour d'une idée."], "pistes": ["En lançant une idée, préciser : « C'est une piste, pas une promesse. »", "Face à une mauvaise nouvelle, rester une minute avec elle avant de chercher une solution.", "Écouter jusqu'au bout les collègues qui signalent un risque.", "Reconnaître une erreur simplement, sans la présenter sous un jour positif."]}, "stressDetail": {"paliers": ["Il en fait encore plus : agenda surchargé, nouvelles idées.", "Il se disperse, s'impatiente, arrive en retard, oublie des engagements.", "Il esquive : humour, changement de sujet, « je m'en occupe plus tard ».", "Il devient critique et cassant : il sermonne, pinaille, ironise.", "Il abandonne le projet ou cherche une issue ailleurs, épuisé."], "revenir": ["Un projet exigeant qui mérite son enthousiasme.", "De l'autonomie dans un cadre clair, avec des points d'étape.", "Un binôme qui assure le suivi et la finition."]}, "ailes": [{"aile": 6, "nom": "L'Animateur", "texte": "Plus drôle, plus chaleureux, plus inquiet aussi ; il aime le groupe et craint de perdre le lien."}, {"aile": 8, "nom": "Le Réaliste", "texte": "Plus direct, pragmatique et ambitieux ; il veut concrétiser et s'affirme davantage."}], "instincts": {"conservation": {"nom": "Gardien du château", "texte": "Bâtisseur de réseau, pragmatique, il flaire les occasions et s'entoure d'alliés de confiance, sans toujours voir la part de son intérêt personnel."}, "social": {"nom": "Sacrifice", "texte": "Il met ses envies de côté au service du groupe ou d'une cause, et espère être reconnu pour cela. Il se sent vite freiné par la lenteur des autres."}, "teteATete": {"nom": "Fascination", "texte": "Rêveur enthousiaste, il voit les projets plus beaux qu'ils ne sont et s'enflamme vite, au risque de perdre le contact avec le réel."}}, "manager": {"planifier": {"force": "Il mène plusieurs projets de front et s'adapte vite.", "angle": "Directives vagues et changements de cap : l'équipe peine à suivre son rythme."}, "decider": {"force": "Il voit de nombreuses options et des solutions originales.", "angle": "Il garde les options ouvertes trop longtemps ; ses priorités changent brusquement."}, "deleguer": {"force": "Il laisse beaucoup d'autonomie et traite ses collaborateurs en pairs.", "angle": "Il contrôle trop peu et délègue surtout les tâches qui l'ennuient."}, "retour": {"force": "Il encourage, célèbre les réussites, voit le meilleur en chacun.", "angle": "Il a du mal à dire ce qui ne va pas et supporte mal la critique de son propre travail."}, "conflit": {"force": "Il détend l'atmosphère et cherche une solution où chacun gagne.", "angle": "Il évite l'affrontement, laisse pourrir la situation ou rejette la faute sur ceux qui ont exécuté."}}, "besoins": {"donne": ["Un projet neuf, des défis variés, quelque chose à apprendre.", "La liberté d'organiser son travail à sa façon.", "Une équipe gaie, qui joue le jeu des idées.", "La reconnaissance du plaisir partagé et des réussites, même petites."], "prend": ["La routine, les tâches répétitives, la paperasse.", "Être surveillé de près, entendre « non, on ne peut pas ».", "Les réunions qui traînent sans aller à l'essentiel.", "Une ambiance lourde, des plaintes sans solution."]}, "diriger": ["Lui confier plusieurs missions variées, avec une idée générale et la liberté d'expérimenter.", "Fixer des échéances réalistes et des points d'étape réguliers, notés par écrit.", "L'associer à un collègue qui aime concrétiser et assurer le suivi.", "Faire les critiques en privé, sur des faits précis, et ne pas le laisser esquiver."], "confusions": [{"avec": 3, "distinguer": "Tous deux sont actifs et très occupés ; mais le 3 reste maîtrisé et vise la reconnaissance de sa réussite, quand le 7 cherche la variété et la stimulation pour échapper à l'inconfort."}, {"avec": 2, "distinguer": "Tous deux sont chaleureux et sociables ; mais le 2 veut être indispensable à l'autre, alors que le 7 ne veut dépendre de personne ni qu'on dépende de lui."}, {"avec": 9, "distinguer": "Tous deux évitent les conflits ; mais le 7 recherche la stimulation et l'activité, le 9 cherche la tranquillité et fuit l'excès de sollicitations."}, {"avec": 6, "distinguer": "Tous deux sont mus par l'inquiétude ; mais le 6 y répond en vérifiant et en cherchant des garanties, le 7 en fuyant vers des projets agréables et en restant optimiste."}]}, "sources": "H. Palmer, P. et F. Chabreuil, B. Chestnut, D. Riso et R. Hudson, G. Lapid-Bogda"}, {"n": 8, "nom": "Le Protecteur", "alias": "le Chef, le Challenger, « le maître du jeu »", "centre": "ventre", "devise": "Le monde est injuste. Je défends les miens.", "enUnMot": "Rester maître de la situation, ne dépendre de personne et protéger les siens ; au fond, ne jamais se retrouver en position de faiblesse.", "voit": "Il repère d'abord qui détient le pouvoir, et si ce pouvoir s'exerce avec justice. Il veut savoir qui décide, qui est responsable… et ce qu'on ne lui dit pas.", "apporte": ["Il décide vite et fait avancer les dossiers bloqués.", "Il dit les choses en face : avec lui, on sait où l'on en est.", "Il protège son équipe et défend ceux qu'on traite injustement.", "Il tient bon dans la crise et mobilise les autres quand tout vacille."], "pieges": ["Il intimide sans le vouloir, par sa seule présence ou son ton.", "Il délègue peu, contrôle de près et reprend tout en main s'il perd confiance.", "Il prend le compromis pour une capitulation.", "Il nie sa fatigue et ses limites, jusqu'au surmenage."], "stress": {"vers": 5, "resume": "Quand la lutte ne paie plus, il tend à se retirer : porte fermée, silence, il rumine et prépare sa riposte.", "signes": ["Il ne vient plus aux temps informels et se coupe de l'équipe.", "Il se documente en secret, accumule des éléments, devient distant et froid.", "Il néglige sommeil et repas, tout en refusant d'avouer sa fatigue."]}, "confiance": {"vers": 2, "resume": "En sécurité, il baisse la garde : il soutient au lieu de s'imposer et se montre généreux et attentionné.", "signes": ["Il propose son aide à un collègue en difficulté, sans qu'on le lui demande.", "Il accepte d'être aidé sans y voir une défaite.", "Sa force se met au service des autres plutôt que de sa position."]}, "niveaux": {"bien": "Magnanime et courageux, il met sa force au service de l'équipe et des plus fragiles. Il sait pardonner, écouter et se montrer doux.", "moyen": "Pragmatique et dominateur, il teste ses interlocuteurs, impose son rythme et nie sa fatigue. Tout ou rien : il fonce ou il s'ennuie.", "mal": "Il voit des adversaires partout, intimide et cherche à « égaliser le score ». Il risque de finir seul, coupé d'une équipe qu'il a fini par traiter en adversaire."}, "communiquer": {"style": "Il parle à l'impératif : direct, bref, parfois brusque, il va droit à l'essentiel et attend la même franchise. H. Palmer note que sa franchise peut blesser sans qu'il s'en rende compte et que sa puissance intimide les personnalités plus douces.", "faire": ["Allez droit au but : l'essentiel d'abord, sans préambule.", "Donnez-lui toute l'information, même mauvaise : une nouvelle difficile passe, une information retenue jamais.", "Tenez votre position calmement : il respecte qui lui tient tête.", "Fixez des règles du jeu claires et des conséquences connues, puis appliquez-les."], "eviter": ["Le flou, les sous-entendus, les décisions prises dans son dos.", "Le contrôle tatillon de son travail et la surveillance de détail.", "Céder par peur de lui, ou hésiter : il le lit comme une faiblesse."]}, "scene": {"titre": "La remarque de trop", "texte": "Karim, chef d'équipe dans une entreprise de logistique, apprend qu'un responsable a critiqué l'un de ses gars devant tout le monde. Il va le voir directement : « Si tu as un souci avec mon équipe, c'est à moi que tu viens le dire. » L'affaire est réglée en cinq minutes ; l'autre s'en souvient longtemps."}, "approfondir": {"communication": {"parle": "Il parle fort, peu et sans détour : des affirmations et des consignes plus que des questions. Il pense souvent à voix haute, et ce que lui vit comme une discussion animée, l'autre peut le vivre comme une agression. Sa colère éclate vite et retombe une fois exprimée.", "ecoute": "Il filtre ce qui touche au pouvoir, à la justice et à la loyauté : qui décide, qui est fiable, ce qu'on lui cache. Les détours et les précautions oratoires lui font soupçonner une manœuvre.", "signauxPositifs": ["Fort, direct, protecteur des personnes vulnérables.", "Attaché à la loyauté et à l'honnêteté.", "Capable de mobiliser une équipe en situation de crise ; inspire confiance et respect."], "signauxNegatifs": ["Intimidant, voire dominateur ; son besoin de contrôle peut étouffer les autres.", "Autant craint que respecté dans son milieu professionnel.", "Une franchise qui blesse sans qu'il s'en aperçoive."], "retour": ["Soyez factuel et franc : il préfère une critique nette à un compliment enrobé.", "Assumez votre part, expliquez clairement, proposez une solution.", "Notez aussi ce qui va : chez lui l'absence de reproche vaut satisfaction, il oublie que les autres ont besoin d'entendre le positif."], "tension": ["Ne prenez pas son ton pour une attaque personnelle : laissez la colère s'exprimer, elle retombe vite.", "Restez ferme et calme, sans surenchère ni recul.", "Revenez ensuite aux faits et aux règles communes, en tête-à-tête plutôt qu'en public."], "canal": "Le face-à-face, bref et direct. H. Palmer souligne qu'il valorise la présence physique et l'information directe : un long courriel ou un intermédiaire nourrit sa méfiance."}, "progresser": {"forces": ["Il dit clairement ce qu'il pense : pas de double discours.", "Il ose aborder les sujets que d'autres évitent.", "Il défend publiquement ceux qui ne peuvent pas se défendre."], "pistes": ["Doser sa force : pour un courriel ou une réunion, chercher l'énergie juste.", "Avant de trancher, écouter et attendre ; se demander : « Et si je me trompais ? »", "Demander à un collègue de confiance l'effet qu'il produit sur lui.", "Quand la colère monte, chercher ce qui le blesse ou l'inquiète en dessous."]}, "stressDetail": {"paliers": ["Il accélère : plus de travail, plus d'intensité, la fatigue est niée.", "Il durcit le ton, exige des comptes, soupçonne des manœuvres.", "Colères pour des broutilles, intimidation : tout compromis devient une capitulation.", "Il se ferme : porte close, silence ; il rumine et prépare sa riposte.", "Il s'épuise ou se coupe de tous : insomnie, excès, isolement, idées de revanche."], "revenir": ["Une information complète et une explication franche de ce qui se passe.", "Un interlocuteur qui lui tient tête sans le menacer ni le contourner.", "Du repos réel, dès le premier signal : une force excessive dans les gestes ordinaires et une fatigue niée (D. Riso et R. Hudson ; G. Lapid-Bogda)."]}, "ailes": [{"aile": 7, "nom": "l'Indépendant, ou le Franc-tireur", "texte": "Plus expansif, entreprenant, aventurier : le plus ouvertement affirmé. Il aime lancer et conquérir."}, {"aile": 9, "nom": "l'Ours", "texte": "Plus calme et plus stable, une force tranquille. Il protège plus qu'il ne s'impose et sait rassurer."}], "instincts": {"conservation": {"nom": "Satisfaction", "texte": "Le bâtisseur pragmatique : concret, peu bavard, il veut des ressources sûres et défend son territoire, ses outils, ses moyens. Il négocie serré."}, "social": {"nom": "Solidarité (ou Amitié)", "texte": "Le protecteur du groupe : il se bat contre les injustices faites à l'équipe ou aux plus fragiles et attend une loyauté sans faille. C'est le 8 qui coopère le plus volontiers, et il ne ressemble pas toujours à un 8."}, "teteATete": {"nom": "Possession", "texte": "Le leader charismatique : intense, provocateur, il occupe le centre de la scène et entraîne les autres. Il exige la loyauté et supporte mal la lenteur."}}, "manager": {"planifier": {"force": "Il donne un cap clair et un « plan de bataille » (H. Palmer) pour lancer ou redresser.", "angle": "La gestion courante l'ennuie ; son énergie inemployée se reporte sur des détails ou de petites escarmouches."}, "decider": {"force": "Rapide, tranché, il prend les risques et assume les décisions impopulaires.", "angle": "Il décide seul, oublie de consulter ou d'informer ; une fois lancé, il change difficilement de cap."}, "deleguer": {"force": "Il donne les grandes lignes et de l'autonomie à qui a fait ses preuves.", "angle": "Il délègue peu, teste longuement, et reprend tout en main quand il perd confiance."}, "retour": {"force": "Franc et clair : chacun sait où il en est.", "angle": "Avare de compliments ; sa critique peut blesser."}, "conflit": {"force": "Il ne fuit pas l'affrontement et respecte qui lui tient tête.", "angle": "Il voit le compromis comme une faiblesse et peut chercher à « égaliser le score »."}}, "besoins": {"donne": ["Un défi à relever, un obstacle à abattre.", "De l'autonomie et la responsabilité d'un résultat.", "Des interlocuteurs francs et une information complète, même mauvaise.", "La camaraderie d'une équipe loyale : « pour les Huit, l'amitié équivaut à la sécurité » (H. Palmer)."], "prend": ["Le flou, les sous-entendus, l'information retenue.", "Les réunions interminables et la paperasse.", "Être surveillé dans le détail, contrôlé, bridé.", "La lenteur, les hésitations, une routine sans enjeu."]}, "diriger": ["Confiez-lui un territoire à lui, avec des objectifs clairs : un chantier, un dispositif à lancer ou redresser.", "Annoncez les limites et les conséquences de leur dépassement, puis tenez-les : privé de règles claires, il peut se sentir menacé et refuser de collaborer (H. Palmer).", "Montrez un leadership ferme et juste : s'il juge la direction défaillante, il tend à s'imposer lui-même, quel que soit le titre (H. Palmer).", "Rappelez-vous qu'il a des sentiments, même s'il ne les montre pas, et qu'il peut aussi être calme et réservé (D. Daniels et V. Price)."], "confusions": [{"avec": 6, "distinguer": "Le 6 qui attaque le fait par peur, puis finit souvent par céder ; le 8 a une volonté solide et redouble d'énergie quand on lui résiste. Le 6 cherche une protection, le 8 en offre une."}, {"avec": 1, "distinguer": "Même sens de la justice. Le 1 persuade par le principe (« c'est ce qu'il faut faire ») ; le 8 s'impose par sa conviction et défend avant tout « les siens »."}, {"avec": 9, "distinguer": "Surtout entre un 8 aile 9 et un 9 aile 8. Le 8 aime débattre et le conflit l'énergise ; le 9 fuit la confrontation pour garder la paix."}, {"avec": 3, "distinguer": "Tous deux ambitieux. Le 8 cherche le pouvoir concret et ne se compare pas ; le 3 cherche la reconnaissance et se compare sans cesse."}, {"avec": 5, "distinguer": "Le 8 en retrait peut sembler un 5. Mais le 8 prend les problèmes de front et agit ; le 5 se retire pour éviter toute dépendance."}]}, "sources": "H. Palmer ; D. Riso et R. Hudson ; P. et F. Chabreuil ; B. Chestnut ; C. Naranjo (sous-types) ; G. Lapid-Bogda ; D. Daniels et V. Price ; M. Bradel."}, {"n": 9, "nom": "Le Médiateur", "alias": "le Pacificateur, le Maître de l'harmonie, le Temporisateur", "centre": "ventre", "devise": "Reste tranquille. Trouve la paix.", "enUnMot": "Garder la paix, en lui et autour de lui, et que tout le monde s'entende ; au fond, ne pas être coupé des autres.", "voit": "Là où d'autres voient un débat à gagner, il voit tous les points de vue, chacun avec sa part de vérité, et il sent les tensions de l'équipe. Son propre avis et ses propres dossiers passent souvent après.", "apporte": ["Il écoute chacun et fait que tous se sentent entendus et inclus.", "Il trouve le terrain d'entente entre des positions opposées.", "Il reste calme dans la crise quand les autres s'affolent.", "Il est fiable, régulier, tenace, et partage le mérite avec toute l'équipe."], "pieges": ["Il dit oui en pensant non, puis le travail prend du retard.", "Il remet l'essentiel à plus tard et s'absorbe dans l'accessoire.", "Il tait son avis, puis se vexe qu'on ne le lui ait pas demandé.", "Contraint, il résiste en silence : il ralentit, fait le strict minimum, s'entête."], "stress": {"vers": 6, "resume": "Devant l'échéance qu'il a laissée venir, il tend à s'inquiéter, à douter et à reporter la faute sur la direction ou « le système ».", "signes": ["Il exprime soudain des inquiétudes : « Tout le monde va être mécontent. »", "Il se plaint de la direction, des consignes, des autres.", "Il devient méfiant et pose des questions en série, lui d'habitude si tranquille."]}, "confiance": {"vers": 3, "resume": "En confiance, il se met en mouvement pour ses propres objectifs, se fixe des étapes et ose se montrer.", "signes": ["Il porte un projet à lui et le mène à terme.", "Il prend la parole et découvre, surpris, qu'on l'écoute.", "Il hiérarchise ses priorités et devient nettement plus productif."]}, "niveaux": {"bien": "Présent, serein et dynamique, il accueille les désaccords, prend position et sait dire non. Une force calme qui rassemble l'équipe.", "moyen": "Il dit oui pour avoir la paix, minimise les problèmes et s'abrite dans ses habitudes. Les petites tâches remplissent la journée, l'essentiel attend.", "mal": "Il se coupe de la réalité, se raccroche à l'idée que « tout va bien » et s'entête en silence. Il se néglige et peut sombrer dans l'apathie."}, "communiquer": {"style": "Il parle en récits, avec beaucoup de détails et de points de vue, au risque de noyer l'essentiel ; sa neutralité est souvent prise pour de l'indécision. H. Palmer prévient : il dit ce que l'on veut entendre, ce qui ne signifie pas qu'il soit d'accord.", "faire": ["Demandez explicitement son avis, et laissez-lui le temps de répondre.", "Demandez plutôt qu'ordonner : un ton autoritaire le fait se fermer.", "Clarifiez le cadre : priorités, échéances, qui décide quoi.", "Vérifiez l'accord : un hochement de tête veut souvent dire « je vous ai entendu »."], "eviter": ["Les ordres secs et la pression de l'urgence.", "L'oublier : ne pas le consulter, ne pas l'informer.", "Le bras de fer : dans une résistance silencieuse, il tiendra plus longtemps que vous."]}, "scene": {"titre": "Le choix du prestataire", "texte": "Laurent, responsable des achats, doit trancher entre deux prestataires, chacun soutenu par un service. Il organise une réunion de plus, puis une autre, à la recherche d'un compromis qui conviendrait à tous. Trois semaines plus tard, le dossier attend toujours ; entre-temps, il a traité des dizaines de petites tâches."}, "approfondir": {"communication": {"parle": "Il parle posément, sans hausser le ton, et raconte volontiers en détail en donnant tous les angles. Il présente souvent le résultat de sa réflexion sans le chemin, d'où des décisions qui semblent « tomber du ciel », globales, parfois vagues. Il sait mieux dire ce qu'il ne veut pas que ce qu'il veut.", "ecoute": "Il entend d'abord ce qui menace l'harmonie : un ton tendu, un désaccord, une pression. Il retient ce qui va dans le sens de l'apaisement et minimise le reste, ce qui peut lui faire sous-estimer un problème.", "signauxPositifs": ["Patient, bienveillant, capable d'écouter toutes les opinions : un médiateur naturel.", "Reconnaît ce qui est essentiel pour les autres et les aide à l'obtenir.", "Une endurance et une patience réelles."], "signauxNegatifs": ["Peut s'endormir sur ses tâches.", "Une résistance passive : il sait ce qu'on attend de lui, mais ne le fait pas.", "Un entêtement silencieux, frustrant pour un responsable qui ne comprend pas d'où vient la résistance."], "retour": ["Équilibrez les observations positives et négatives, comme le conseille H. Palmer.", "Restez sur les faits et les solutions, sans reproche : il se ferme dès qu'il se sent jugé.", "Concluez par une ou deux priorités précises, avec une échéance, et vérifiez qu'il les reformule."], "tension": ["Baissez le ton et la pression : l'urgence le fige.", "Invitez-le à dire son désaccord, en privé, et accueillez-le sans le contredire aussitôt.", "Après un échange tendu, revenez vers lui pour réparer le lien."], "canal": "L'entretien individuel au calme, où il se sent consulté, suivi d'un court écrit qui récapitule priorités et échéances. En grande réunion, il a tendance à se taire ou à acquiescer."}, "progresser": {"forces": ["Une écoute patiente et respectueuse de tous.", "Le talent de reformuler les positions opposées pour les rapprocher.", "Un ton apaisant qui fait baisser la tension."], "pistes": ["En réunion, donner son avis au moins une fois, surtout s'il diffère.", "Partager sa réflexion en cours, pas seulement la décision finale.", "Avant de dire oui, se demander « En ai-je envie ? » et s'accorder un délai : « Laissez-moi y réfléchir. »", "Indécis, procéder par élimination : « pas ça, pas ça… » (H. Palmer)."]}, "stressDetail": {"paliers": ["Il dit oui à tout et s'occupe des petites tâches ; l'essentiel attend.", "Il remet à plus tard et se disperse : « ça va s'arranger ».", "Résistance passive : il oublie, fait le strict minimum, fait la sourde oreille.", "L'échéance arrive : panique, inquiétude, plaintes contre la direction.", "Il se fige et s'engourdit… ou explose, à sa propre surprise."], "revenir": ["Qu'on lui demande son avis et qu'on en tienne compte.", "Un cadre clair, découpé en étapes, avec une échéance proche.", "Un soutien bienveillant, sans reproche, pour l'aider à repartir. G. Lapid-Bogda note qu'il met deux à trois fois plus de temps que d'autres à sentir qu'il est contrarié : retards et oublis parlent souvent pour lui."]}, "ailes": [{"aile": 8, "nom": "l'Arbitre", "texte": "Plus concret, plus sociable, plus affirmé : doux et fort à la fois. Il sait prendre position, mais il est têtu et ses colères sont imprévisibles."}, {"aile": 1, "nom": "le Rêveur", "texte": "Plus idéaliste, plus réservé, attaché à l'ordre. Sa colère prend la forme d'une indignation contenue."}], "instincts": {"conservation": {"nom": "Appétit", "texte": "Le pilier tranquille : concret, solide, plus têtu que les autres 9. Il tient à ses routines et à ses petits conforts, et aime travailler seul, à son rythme."}, "social": {"nom": "Participation", "texte": "Le travailleur du collectif : énergique, très productif, il se donne pour le groupe sans montrer sa fatigue. B. Chestnut le décrit souvent comme un bon leader, loin du cliché du « 9 paresseux »."}, "teteATete": {"nom": "Union (ou Fusion)", "texte": "Le partenaire attentif : très doux, il s'aligne sur un collègue ou un responsable proche et épouse ses objectifs, au risque d'oublier les siens."}}, "manager": {"planifier": {"force": "Il bâtit une structure stable et des méthodes éprouvées, faites pour durer.", "angle": "L'énergie lui manque pour bousculer la routine quand la situation l'exige."}, "decider": {"force": "Il consulte tout le monde et se fait une vue d'ensemble complète.", "angle": "Il laisse passer l'heure de la décision, puis concède un petit quelque chose à chacun."}, "deleguer": {"force": "Il accepte chacun tel qu'il est et laisse beaucoup d'autonomie.", "angle": "Il peut mettre en place un système puis le laisser tourner « en roue libre » (H. Palmer), sans suivi."}, "retour": {"force": "Il valorise et cherche des solutions plutôt que des coupables.", "angle": "Par peur de blesser, il tait ce qui ne va pas ou ferme les yeux sur une erreur."}, "conflit": {"force": "Il rapproche les points de vue et trouve le terrain d'entente.", "angle": "Il se défile : chacun croit son avis accepté alors qu'il n'a simplement pas été refusé."}}, "besoins": {"donne": ["Une ambiance paisible, où chacun s'entend.", "Qu'on lui demande son avis, et qu'on en tienne compte.", "Une reconnaissance sincère, qu'il ne réclame jamais.", "Une réussite attribuée à toute l'équipe."], "prend": ["Des conflits qui durent ou s'enveniment.", "Les décisions à prendre dans l'urgence.", "Les ordres lancés sur un ton autoritaire.", "Être oublié : pas consulté, pas informé ; ou un collègue qui tire la couverture à lui."]}, "diriger": ["Donnez un cadre explicite : objectifs, responsabilités, critères d'évaluation ; il peut alors travailler beaucoup et bien (P. et F. Chabreuil).", "Découpez les missions en étapes avec des échéances proches : une fois lancé, il ne s'arrête plus (H. Palmer).", "Sollicitez son avis en entretien individuel avant les décisions qui le concernent, et dites-lui ce que vous en avez fait.", "Ne confondez pas calme et adhésion ni lenteur et manque d'envergure : D. Daniels tient le « 9 sans leadership » pour un mythe."], "confusions": [{"avec": 6, "distinguer": "Son hésitation ressemble au doute du 6 (H. Palmer). Mais le 9 reste imperturbable et garde ses inquiétudes pour lui ; le 6 affiche ses doutes et a besoin d'en parler."}, {"avec": 2, "distinguer": "Tous deux font passer les autres d'abord. Le 2 va chercher l'autre et sait ce qu'il ressent ; le 9 attend, accommodant, avec un sens de lui-même plus diffus."}, {"avec": 8, "distinguer": "Surtout entre un 9 aile 8 et un 8 aile 9. Le 9 fuit la confrontation pour garder la paix ; le 8 aime débattre et le conflit l'énergise."}, {"avec": 1, "distinguer": "Tous deux mal à l'aise avec leur colère. Le 9 préserve la paix même s'il a des convictions ; le 1 défend ses principes, quitte à créer le désaccord."}, {"avec": 5, "distinguer": "Tous deux calmes et en retrait. Le 9 est accueillant et fait confiance ; le 5 est plus méfiant, et sa pensée plus pointue que synthétique."}]}, "sources": "H. Palmer ; D. Riso et R. Hudson ; P. et F. Chabreuil ; B. Chestnut ; C. Naranjo (sous-types) ; G. Lapid-Bogda ; D. Daniels ; A. Valderrama et B. Foenix-Riou."}];
const DUOS = {"1-1": {"accroche": "Deux exigeants côte à côte : solide, mais tendu.", "force": "Ils partagent le goût du travail bien fait, le sérieux et le professionnalisme. Ils se soulagent mutuellement de la charge des responsabilités.", "friction": "Chacun est sûr d'avoir raison et guette l'erreur de l'autre. Le duo peut aussi se refermer sur lui-même et juger sévèrement les collègues.", "aDirige": "Quand un Un dirige un autre Un, la lutte porte sur « ce qui est juste » : l'un pense à l'institution, l'autre à l'équipe. Le subordonné qui se sent lésé se replie dans un service minimum, strictement réglementaire.", "bDirige": "Entre pairs, ils se surveillent, exigent la perfection l'un de l'autre et repoussent les décisions faute d'oser trancher.", "conseil": "Prévoir une issue où personne ne perd la face, et s'appuyer sur un avis extérieur reconnu pour trancher."}, "1-2": {"accroche": "Rigueur et dévouement, si la critique ose s'exprimer.", "force": "Le Deux, une fois reconnu, se montre consciencieux et très productif. Le Un apporte le cadre et le sérieux.", "friction": "Le Un veut avoir raison, le Deux veut être apprécié : le Deux n'ose pas contredire et se cantonne au rôle d'aide dans l'ombre.", "aDirige": "Le Un raisonne en compétences et en procédures, parfois sans tenir compte du ressenti. Le Deux perçoit le malaise mais se tait ; le duo gagne quand il ose proposer et discuter.", "bDirige": "Le Deux dirige par la relation, avec des proches privilégiés et des humeurs vives mais brèves. Le Un déteste le favoritisme et rumine longtemps une critique lancée à la légère.", "conseil": "Le Deux qui dirige gagne à réparer vite une parole trop vive ; le Deux subordonné, à soutenir le projet plutôt qu'à chercher l'approbation."}, "1-3": {"accroche": "Qualité contre quantité : complémentaires s'ils s'écoutent.", "force": "Deux gros travailleurs. Le Trois avance vite vers l'objectif, le Un garantit la qualité du résultat.", "friction": "Le Trois prend des raccourcis et laisse les détails pour plus tard ; le Un en est exaspéré. Aucun des deux n'aime reconnaître une erreur.", "aDirige": "Le Un contrôle de près et veut justifier chaque étape ; le Trois risque de contourner les règles. Cela marche bien si le Trois a une marge de manœuvre sur le terrain et fait remonter des informations utiles.", "bDirige": "Le Trois mène plusieurs dossiers de front et délègue le suivi sans toujours l'expliquer ; le Un piétine faute de direction claire. Si le Un ne se sent pas reconnu, il ralentit.", "conseil": "Le Un présente ses remarques en termes d'efficacité et de résultat ; le Trois associe et valorise le Un dans le projet."}, "1-4": {"accroche": "Une exigence commune, à condition de reconnaître l'autre.", "force": "Tous deux respectent le travail abouti et rejettent le médiocre. Le cadre du Un aide le Quatre à concrétiser ses idées.", "friction": "Le Quatre supporte mal un fonctionnement par règlements qui oublie les personnes ; il peut alors refuser les règles et exprimer son amertume.", "aDirige": "Le cadre du Un rassure le Quatre et l'aide à mener ses projets à terme. Si le Un reste distant et purement réglementaire, le Quatre se sent nié et conteste tout.", "bDirige": "Le Quatre dirige avec élan et créativité, mais par phases : périodes brillantes puis désintérêt. Le Un s'inquiète de ce pilotage imprévisible et réclame un calendrier tenu.", "conseil": "Montrer un intérêt réel pour le projet du Quatre, et passer par une médiation en cas de conflit ouvert."}, "1-5": {"accroche": "Méthode, sobriété et esprit critique partagés.", "force": "Ils partagent l'esprit critique, le sens pratique et le goût de l'économie : ensemble, ils chassent le gaspillage et produisent un travail très documenté.", "friction": "Face aux difficultés, chacun se retire. Plus le Un exige, moins le Cinq donne.", "aDirige": "Le Un apprécie la rigueur du Cinq dans le traitement des informations. Il gagne à fixer clairement les attentes et à ne pas en demander davantage une fois l'objectif atteint.", "bDirige": "Le Cinq fixe des objectifs précis et travaille avec méthode, ce qui convient au Un. Mais le Un vit le silence comme une critique : le Cinq doit aller vers lui.", "conseil": "Définir clairement le contour de la mission, puis laisser chacun l'accomplir à sa manière, en gardant des échanges réguliers."}, "1-6": {"accroche": "Des analyses solides, si la confiance est entretenue.", "force": "Tous deux aiment poser les questions difficiles et anticiper les problèmes : ensemble, ils produisent des analyses très étayées.", "friction": "Le Un s'en tient aux règles, le Six doute de leur bien-fondé. Le Six lit un manque d'éloges comme une menace.", "aDirige": "Le Un, avare de compliments, inquiète le Six, qui cherche des alliés et se demande s'il peut faire confiance. Il faut rassurer, couper court aux rumeurs et éviter le tout-bien ou tout-mal.", "bDirige": "Le Six dirige bien à court terme, par échéances et relances, mais peine sur la durée. Le Un, loyal envers un bon chef, apprécie les échanges informels qui dissipent les craintes.", "conseil": "Multiplier les points informels courts (« tout va bien ? ») pour vérifier la réalité plutôt que de laisser grandir les inquiétudes."}, "1-7": {"accroche": "Idées foisonnantes et cadre rigoureux : à accorder.", "force": "Le Sept invente, planifie et ouvre des pistes ; le Un structure, suit et contrôle.", "friction": "Le Un pense en « juste ou faux », le Sept en idées qui s'entrecroisent. Le Un voit les excuses du Sept comme de la mauvaise foi.", "aDirige": "Le Un relève les petites erreurs ; le Sept se défend par des justifications. Mieux vaut moins de procédures, des échéances raisonnables et une évaluation sur les résultats.", "bDirige": "Le Sept change de cap ou laisse des consignes incomplètes ; le Un se sent démuni et applique alors les ordres à la lettre, sans plus.", "conseil": "Prendre le temps de préciser ensemble les consignes : le Un comble alors les détails et libère le Sept."}, "1-8": {"accroche": "Deux forces de travail, alliées ou rivales.", "force": "Deux travailleurs acharnés, centrés sur les résultats. Le Huit entraîne, le Un aide à ajuster.", "friction": "La colère circule : le Un la contient, le Huit l'exprime. Chacun pense avoir la bonne façon de diriger.", "aDirige": "Le Huit vit même une règle juste comme un rapport de force et refuse de rendre des comptes. Le Un gagne à juger sur les résultats et à lui laisser de l'autonomie.", "bDirige": "Le Huit contrôle par sa présence et ses éclats ; le Un rumine en silence et attend de prouver qu'il a raison. Quand ils s'accordent, le Huit rassure et le Un l'aide à doser.", "conseil": "Évaluer sur des résultats concrets plutôt que sur la manière, et vider les désaccords tôt et calmement."}, "1-9": {"accroche": "Une organisation solide et durable, un peu lente.", "force": "Tous deux aiment améliorer des procédés éprouvés et bâtir une organisation stable. Ils excellent dans un domaine d'expertise.", "friction": "Ni l'un ni l'autre n'aime le risque ni les décisions rapides : les choix sont reportés. Le Un critique, le Neuf résiste en silence.", "aDirige": "Le Un fournit la structure dont le Neuf a besoin. Mais le Neuf peu encouragé ralentit et fait la sourde oreille sans le dire, ce qui exaspère le Un.", "bDirige": "Le Neuf installe des systèmes puis les laisse tourner. Le Un l'aide utilement par son sens du détail, si le Neuf ose lui déléguer.", "conseil": "Équilibrer remarques positives et critiques, et poser des échéances de décision claires."}, "2-2": {"accroche": "Deux soutiens dévoués, à condition de rôles égaux.", "force": "Ils s'investissent dans la tâche commune comme dans une personne à servir. Bien coordonnés, ce sont deux excellents promoteurs d'un projet.", "friction": "Chacun veut se rendre indispensable : la rivalité guette. Sensibles à la critique, ils ont tendance à se défendre en se dédouanant.", "aDirige": "Le Deux qui dirige cherche des décisions populaires et soutient discrètement ses proches ; le Deux subordonné peut se sentir aussi important que le chef et se vexer s'il n'est pas consulté.", "bDirige": "Entre pairs, ils coopèrent bien si chacun a un rôle clair et d'égale importance ; sinon, ils se disputent la place de l'indispensable.", "conseil": "Rendre les règles et les critères d'avancement explicites, et distinguer clairement la critique du travail du respect de la personne."}, "2-3": {"accroche": "Une équipe redoutable pour produire et convaincre.", "force": "Tous deux savent produire et valoriser un projet. Le Deux humanise l'image du Trois et l'aide à toucher les gens.", "friction": "Le Trois, pris par l'objectif, oublie la relation ; le Deux ne demande rien mais en souffre, et peut retirer son soutien.", "aDirige": "Le Deux veut être apprécié ; le Trois, ambitieux, peut viser sa place et déborder de son rôle. Le Deux gagne à lui confier un périmètre précis en gardant la main sur les objectifs.", "bDirige": "Le schéma le plus courant. Si le Trois reconnaît l'apport du Deux, tout va bien ; s'il le traite comme un simple rouage, le Deux se détourne et peut nuire à son image en coulisses.", "conseil": "Le Trois prend le temps d'échanges personnels avec le Deux ; le Deux pose des limites claires au Trois."}, "2-4": {"accroche": "Un climat chaleureux, si chacun garde sa place.", "force": "Ils créent ensemble une ambiance très tournée vers les relations humaines, où chacun se sent appartenir à l'équipe.", "friction": "Le Deux veut être indispensable, le Quatre veut être unique : ils se font concurrence. Le Quatre peut trouver les attentions du Deux intéressées.", "aDirige": "Le Quatre peut juger artificielle la manière séduisante de diriger du Deux, ou lire son intérêt comme un examen critique. Lui confier un domaine propre, puis lui laisser de l'espace, apaise la rivalité.", "bDirige": "Le Deux aime soutenir un Quatre qui dirige avec brio. Mais s'il se sent ignoré à cause des humeurs du Quatre, il lève le pied sans le dire.", "conseil": "Reconnaître au Quatre un domaine qui lui est propre, et montrer au Deux que son rôle compte et que les humeurs du chef ne le visent pas."}, "2-5": {"accroche": "Des talents opposés qui se complètent bien.", "force": "Le Deux gère les relations, le Cinq l'analyse et le travail autonome. Leurs talents sont si différents que le duo fonctionne quel que soit le chef.", "friction": "La sollicitude du Deux peut paraître intrusive au Cinq, qui protège fortement son espace.", "aDirige": "Le Deux s'intéresse au ressenti de son collaborateur, ce que le Cinq vit comme une intrusion. Mieux vaut lui confier des tâches précises, de l'autonomie, et parler du travail.", "bDirige": "Le Cinq reste peu accessible et le Deux se sent privé d'échanges. Un Cinq avisé en fait son relais auprès des équipes et ménage des temps d'écoute.", "conseil": "Centrer les échanges sur le projet commun : le Cinq informe, le Deux assure le lien avec les autres."}, "2-6": {"accroche": "Alliés solides dans la tempête, fragiles dans la routine.", "force": "Ils forment une alliance naturelle dans un contexte difficile ou contesté, quand ils agissent selon leurs convictions.", "friction": "Le Deux recherche la proximité avec les personnes influentes, ce qui éveille la méfiance du Six. Le Deux vit les hésitations du Six comme une dérobade.", "aDirige": "Le Six anticipe les problèmes et le Deux les désamorce par son sens politique. Mais si le Six juge le Deux intéressé, une opposition peut se former en coulisses.", "bDirige": "Le Six se demande s'il peut faire confiance au Deux et refuse de le traiter à part. Or le Deux a besoin qu'on reconnaisse ses talents de relais ; sinon il cherche ailleurs.", "conseil": "Clarifier les loyautés et confier au Deux un rôle de lien reconnu et transparent."}, "2-7": {"accroche": "L'idée et sa réalisation, si le projet aboutit.", "force": "Le Sept imagine, le Deux organise et concrétise. C'est un duo classique et efficace au lancement d'un projet.", "friction": "Le Sept se lasse après le démarrage ; le Deux a besoin d'un responsable qui obtient des résultats et qui le reconnaît.", "aDirige": "Le Deux dirige bien le Sept s'il lui confie des tâches stimulantes. Sinon il s'inquiète des délais et oscille entre rapprochement et rupture ; une échéance claire recentre le Sept.", "bDirige": "Le Deux en fait trop pour répondre au Sept, qui change de plan et l'oublie. Débordé et peu reconnu, le Deux cherche une sortie.", "conseil": "Fixer des objectifs stables et des échéances claires, et remercier explicitement le Deux pour son travail."}, "2-8": {"accroche": "Une entente presque parfaite, fondée sur la confiance.", "force": "Quand chacun croit aux intentions de l'autre, ils agissent en accord : le Huit tranche, le Deux fait le lien avec les équipes.", "friction": "Le Huit, attaché à la justice, se méfie des préférences du Deux ; le Deux, attaché à son image, supporte mal la franchise brutale du Huit.", "aDirige": "Le Deux doit gagner le soutien du Huit, qui scrute sa loyauté et conteste les contrôles. Des règles écrites et des limites connues de tous évitent l'affrontement.", "bDirige": "Le Huit est soit très apprécié, soit rejeté. Apprécié, il obtient un soutien fidèle ; le Deux doit alors l'informer largement, car le silence éveille ses soupçons.", "conseil": "Jouer la transparence : partager l'information et écrire les règles du jeu."}, "2-9": {"accroche": "Le Deux donne l'élan, le Neuf la constance.", "force": "Le Deux stimule le Neuf et l'aide à se recentrer sur l'essentiel. Tous deux soignent l'ambiance de l'équipe et se comprennent sans beaucoup de mots.", "friction": "Leurs rythmes diffèrent : le Deux s'impatiente des lenteurs du Neuf, le Neuf multiplie les discussions que le Deux trouve inutiles.", "aDirige": "Le Deux valorise publiquement le Neuf, qui se montre loyal. Mais le Neuf supporte mal le favoritisme, qu'il en soit exclu ou qu'on l'y invite ; une excuse et une mission claire réparent.", "bDirige": "Le Neuf dirige bien quand la voie est tracée. Le Deux l'aide à prendre ses décisions et à synthétiser les avis de l'équipe.", "conseil": "Se mettre d'accord sur un objectif commun et sur un calendrier de décision."}, "3-3": {"accroche": "Un duo invincible… tant qu'ils ne se concurrencent pas.", "force": "Deux énergies tournées vers l'action et le résultat : quand leurs objectifs coïncident, le projet avance vite.", "friction": "La compétition les oppose dès qu'il faut se surpasser. Ils peuvent aussi aller vite au détriment de la profondeur et de la réflexion à long terme.", "aDirige": "Le Trois qui dirige donne le modèle : si l'équipe est valorisée, le Trois subordonné coopère ; si l'exploit individuel est récompensé, il devient un rival.", "bDirige": "Entre pairs, ils coopèrent si les rôles et les perspectives d'évolution sont clairs, et se concurrencent sinon.", "conseil": "Reconnaître les réussites de chacun sans les mettre en concurrence, et valoriser explicitement le travail d'équipe."}, "3-4": {"accroche": "Le volume et l'originalité : fécond ou explosif.", "force": "Le Trois produit beaucoup, le Quatre apporte un travail original et soigné. Le Trois peut faire reconnaître une idée audacieuse du Quatre.", "friction": "Tous deux veulent être reconnus : en rivalité, ils peuvent tout compromettre plutôt que céder. Le Quatre repère vite ce que le Trois fait pour la façade.", "aDirige": "Le Trois attend de l'engagement quel que soit le ressenti, et valorise les idées créatives utiles. Il gagne à éviter de hausser le ton et à rechercher l'adhésion du Quatre.", "bDirige": "Le Quatre peut juger le Trois sans finesse et se sentir menacé par son ambition. Bloqué, le Trois contourne le chef ; un organigramme clair et un tiers médiateur aident.", "conseil": "Éviter de les mettre en compétition et attribuer clairement à chacun sa part du résultat."}, "3-5": {"accroche": "Le penseur et le promoteur : un duo efficace.", "force": "Le Cinq apporte l'analyse et les idées de fond, le Trois les met en œuvre et les fait connaître. Le Trois prend en charge les contacts et protège le Cinq des conflits.", "friction": "Tous deux mettent leurs émotions de côté et évitent les vérités pénibles : le Trois enjolive les mauvaises nouvelles, le Cinq les tait.", "aDirige": "Le Trois attend enthousiasme et soutien affiché ; le Cinq travaille seul, discrètement, et s'épuise au rythme imposé. Il accepte une lourde charge s'il en connaît précisément l'étendue.", "bDirige": "Le Cinq se retranche dans son bureau, ce qui frustre le Trois en quête de reconnaissance. Avec des messages explicites et un rôle bien défini, le Trois devient un excellent exécutant.", "conseil": "Découper un problème difficile en questions précises, traitées lors de rendez-vous fixés à l'avance."}, "3-6": {"accroche": "Le concepteur et le promoteur, si le mérite est partagé.", "force": "Le Six mûrit les idées et anticipe les problèmes, le Trois sait les présenter et les faire adopter.", "friction": "Le Trois a tendance à s'approprier les idées ; le Six, attaché à la reconnaissance de sa contribution, se méfie alors de lui.", "aDirige": "Le Trois doit citer l'apport du Six ; sinon le Six le juge opportuniste et peut mobiliser les collègues contre lui. Le Trois gagne à écouter les signaux négatifs au lieu de les ignorer.", "bDirige": "Le Six paraît trop prudent et réglementaire au Trois ambitieux, qui part s'il ne voit pas de perspective. Le Six gagne à oser davantage et à valoriser l'efficacité.", "conseil": "Reconnaître publiquement qui a conçu quoi avant de mettre en avant le résultat."}, "3-7": {"accroche": "Brillants au démarrage, fragiles à l'arrivée.", "force": "Deux profils dynamiques, capables de mener plusieurs projets de front. Le Sept relie les idées, le Trois les transforme en réussites.", "friction": "Ils prennent tous deux des raccourcis. Le Sept décroche dans les phases routinières, ce que le Trois ne voit pas toujours venir.", "aDirige": "Le Trois prend l'enthousiasme du Sept pour de l'engagement ; le Sept modifie la méthode de lui-même ou délaisse les étapes ennuyeuses. Il faut définir les responsabilités et suivre de près la fin du projet.", "bDirige": "Le Sept inspire au départ puis délègue ou change les consignes ; le Trois comble les vides et finit par piloter à sa place. Mieux vaut lui confier un titre et une mission précise.", "conseil": "Écrire un objectif commun et fixer des points d'étape jusqu'à la clôture du projet."}, "3-8": {"accroche": "Imbattables du même côté, rivaux sinon.", "force": "Deux tempéraments de leader, centrés sur l'action et le résultat. Alliés, ils avancent très vite.", "friction": "Le Huit est direct, le Trois s'adapte à son public : le Huit le soupçonne de manquer de sincérité, le Trois le trouve brutal. La lutte de pouvoir guette.", "aDirige": "Le Huit doute de l'honnêteté du Trois et teste son autorité. Il s'engage pleinement s'il se sent en sécurité : équité visible et perspectives claires.", "bDirige": "Le cas le plus courant. Si le Trois se sent reconnu concrètement, le duo prospère ; mais le Huit se méfie de qui défie son pouvoir, d'où l'intérêt de cadrer clairement rôles et statuts.", "conseil": "Fixer clairement territoires, rôles et règles de reconnaissance, et tenir parole."}, "3-9": {"accroche": "Le moteur et l'écoute, à synchroniser.", "force": "Le Neuf s'inspire du dynamisme du Trois et gagne en régularité. Le Neuf apporte la prise en compte des avis de chacun.", "friction": "Le Trois trouve le Neuf lent ; le Neuf trouve que le Trois néglige les personnes et le climat de l'équipe.", "aDirige": "Le Trois enchaîne les objectifs et ignore le malaise du personnel, que le Neuf perçoit. S'il se sent traité comme un simple outil, le Neuf résiste en silence et freine.", "bDirige": "Le Neuf hésite et multiplie les analyses ; le Trois veut des objectifs courts et précis. Un tiers peut aider chacun à voir l'intérêt de la méthode de l'autre.", "conseil": "Concilier un calendrier de décision clair et un temps réservé à l'écoute de l'équipe."}, "4-4": {"accroche": "Créatifs et intenses, mais instables ensemble.", "force": "Deux personnes capables d'un travail très personnel et original. Ils se soutiennent volontiers dans une crise.", "friction": "Leurs élans retombent quand la routine s'installe. Si l'un se sent moins reconnu que l'autre, l'envie et les piques indirectes apparaissent.", "aDirige": "Le Quatre qui dirige imprime sa marque et innove, mais peut confondre élan émotionnel et intuition fiable, et s'entourer de favoris. Le Quatre subordonné peu mis en valeur cherche alors à attirer l'attention.", "bDirige": "Entre pairs, ils collaborent bien hors compétition et s'ignorent volontiers une fois la crise passée.", "conseil": "Éviter les cercles de favoris et ancrer la coopération dans des règles stables plutôt que dans les affinités."}, "4-5": {"accroche": "Une confiance lente à venir, puis solide.", "force": "Un projet stimulant rend le Cinq plus ouvert. Le Quatre trouve chez lui une expertise fiable et stabilisante.", "friction": "Le Quatre réagit vivement au manque d'attention ; le Cinq se protège par la distance et la froideur.", "aDirige": "Le Quatre apprécie le soutien expert du Cinq. Mais en difficulté, le Cinq se ferme, retient l'information et peut finir par une franchise blessante ; le conflit s'envenime si le Quatre riposte en le dévalorisant.", "bDirige": "Le Cinq filtre l'accès à son bureau et communique par notes ; le Quatre, s'il se sent ignoré, provoque. Mieux vaut l'associer et lui laisser organiser certains domaines à sa manière.", "conseil": "Garder un rendez-vous régulier en face à face et reconnaître explicitement l'apport de chacun."}, "4-6": {"accroche": "Confiance mutuelle ou guerre d'egos.", "force": "Tous deux trouvent de l'énergie face à la difficulté. En situation d'urgence, ils se révèlent complémentaires.", "friction": "Le Six se méfie de ce qui ressemble à du caprice ou à un passe-droit ; le Quatre vit mal la méfiance et les procédures.", "aDirige": "Le Six soutient un Quatre en qui il a confiance, mais surveille tout écart aux règles. Le Quatre gagne à rester constant, transparent, et à informer calmement.", "bDirige": "Le Six doit tenir ses doutes et ne pas grossir les désaccords mineurs. Le Quatre l'aide à trier les vrais problèmes, à condition que le conflit puisse être nommé.", "conseil": "En cas de tension, faire exposer à chacun sa lecture de la situation, avec un tiers si besoin."}, "4-7": {"accroche": "Le possible et le manquant : un duo inventif.", "force": "Le Sept voit ce qui est possible, le Quatre ce qui manque : ensemble, ils inventent. L'optimisme du Sept pousse à agir, l'exigence de forme du Quatre évite la dispersion.", "friction": "Tous deux se lassent des tâches répétitives et peinent à finaliser. Les tâches inachevées sont leur source de conflit la plus fréquente.", "aDirige": "Le Quatre apprécie un Sept inventif tant que les résultats suivent, mais se noie sous ses idées. Il doit fixer des règles et des échéances très précises, et éviter les passe-droits qui froissent l'équipe.", "bDirige": "Le Sept lance et délègue la suite au Quatre. Il obtient son engagement en l'associant au cercle des décisions et en gardant le lien ; sinon le Quatre laisse aller les choses.", "conseil": "Prévoir dès le départ qui finalise quoi, avec des dates fermes jusqu'à la livraison."}, "4-8": {"accroche": "Imbattables, si la loyauté est totale.", "force": "Concentrés sur le travail, ils forment une équipe très forte : le Quatre apporte l'idée audacieuse, le Huit la volonté et la ténacité pour la mener à terme.", "friction": "Tous deux tiennent à leur territoire et s'estiment parfois au-dessus des règles ; aucun ne veut céder. La confiance ne vient qu'une fois les intentions comprises.", "aDirige": "Le Quatre lance le projet et gagne à en confier ensuite la conduite au Huit. Mais le Huit conteste tout changement de règles qu'il ne comprend pas : il faut lui donner la parole.", "bDirige": "Le Huit dirige avec une franchise que le Quatre peut vivre comme une humiliation. Si le Quatre perd ses avantages, la rancune s'installe des deux côtés.", "conseil": "Ne pas changer les règles en cours de route, et faire prendre conscience au Huit de l'effet de son ton."}, "4-9": {"accroche": "L'élan créatif et la mise en œuvre patiente.", "force": "Le Quatre donne l'impulsion et la touche personnelle, le Neuf stabilise et rend le projet réalisable.", "friction": "Le Quatre s'ennuie face aux solutions sans risque du Neuf ; le Neuf se sent oublié sans le dire et peut décrocher.", "aDirige": "Le Quatre impose un rythme énergique qui entraîne le Neuf. Mais le Neuf se fond dans le paysage et se sent négligé en silence : le Quatre doit aller vers lui.", "bDirige": "Les réponses ambivalentes du Neuf insécurisent le Quatre, très attentif à la place de chacun. Un geste d'accueil et des règles claires sur les rôles l'aident à s'intégrer.", "conseil": "Reconnaître explicitement l'apport de chacun et éviter tout favoritisme, même implicite."}, "5-5": {"accroche": "Rigoureux et économes, mais peu communicants.", "force": "Ils excellent dans l'étude, l'analyse et la planification à long terme. Ils allient qualité et économie de moyens, et évitent les confrontations.", "friction": "Chacun travaille dans son domaine sans partager ce qu'il sait : l'information circule mal. Ils peinent à conclure et à agir dans l'incertitude.", "aDirige": "Le Cinq qui dirige tend à découper le travail sans organiser les échanges, à préférer l'écrit aux rencontres et à attendre d'avoir toutes les données ; le Cinq subordonné risque alors de produire une pièce solide mais isolée de l'ensemble.", "bDirige": "Entre pairs, ils s'entendent par des rendez-vous planifiés et des rôles bien définis, mais gagnent à s'associer à des profils plus tournés vers l'extérieur pour conclure.", "conseil": "Instaurer un temps régulier et obligatoire de mise en commun de l'information."}, "5-6": {"accroche": "Excellents stratèges, lents à passer à l'action.", "force": "Ils brillent dans la stratégie, la planification et l'analyse critique.", "friction": "Tous deux surestiment les obstacles et hésitent à se lancer : les idées remplacent l'action.", "aDirige": "Le Cinq communique de façon technique et distribue l'information au strict nécessaire ; le Six se sent tenu à l'écart et s'inquiète. Des réunions d'information ouvertes à tous le rassurent.", "bDirige": "Le Six teste et remet en question ; le Cinq, gêné par le flou, se met en retrait. Le Six y voit de l'hostilité, le Cinq de l'ingérence : une réunion hebdomadaire et des consignes nettes apaisent.", "conseil": "Confier le démarrage d'un projet à d'autres, puis revenir l'améliorer ensemble."}, "5-7": {"accroche": "Riches en idées, pauvres en suivi.", "force": "Ils encouragent la stratégie et la recherche : le Cinq approfondit, le Sept relie et ouvre.", "friction": "Les bonnes idées risquent de ne jamais aboutir. Tous deux évitent le conflit en le rationalisant, jusqu'à ce que la tension ressorte.", "aDirige": "Le Cinq, méthodique, peut obtenir l'appui du Sept ou le braquer par un cadre trop étroit. Le Sept improvise à sa guise, ce qui stresse le Cinq ; bien employé, il coordonne les travaux.", "bDirige": "Le Sept décide au dernier moment et multiplie les informations contradictoires ; le Cinq attend en retrait. Une ligne directrice nette lui permet de stabiliser la situation.", "conseil": "Découper chaque difficulté en petites questions concrètes et nommer clairement qui assure le suivi."}, "5-8": {"accroche": "La réflexion et l'action : alliance naturelle.", "force": "Le Huit agit et protège le Cinq des conflits ; le Cinq apprend au Huit à réfléchir avant d'agir. Le calme du Cinq laisse au Huit la place de s'exprimer.", "friction": "Le Huit cherche le contact direct, le Cinq se retire. Le Huit méprise la prudence, le Cinq redoute l'intrusion.", "aDirige": "Le Cinq dirige à distance, souvent par écrit. Son absence laisse un vide que le Huit comble, ce que le Cinq lit comme de l'insubordination.", "bDirige": "Le Huit est sûr de lui et clivant. Le Cinq avisé l'informe largement, de préférence en face à face, ce qui rassure le Huit sur son engagement.", "conseil": "Le Cinq dit ses positions de vive voix ; le Huit renonce à tout contrôler."}, "5-9": {"accroche": "Une harmonie paisible qui manque parfois d'élan.", "force": "Ni l'un ni l'autre ne cherche la vedette. Le Cinq conçoit des projets solides, le Neuf les rend réalisables et assure le lien avec les autres.", "friction": "Chacun attend que l'autre prenne l'initiative ; tous deux évitent le conflit et se replient quand ça coince.", "aDirige": "Le Cinq dirige à distance et décide en petit comité ; le Neuf, non consulté, résiste en silence et laisse les consignes sans suite. Des temps d'échange collectifs changent tout.", "bDirige": "Le Neuf installe un cadre stable qui convient au Cinq. Le Neuf doit aller vers les conclusions, le Cinq comprendre que les réunions servent aussi à coopérer.", "conseil": "Programmer à l'avance la discussion des sujets délicats, avec un format connu de chacun."}, "6-6": {"accroche": "Solidaires dans l'épreuve, freinés par le doute.", "force": "Ils s'engagent à se sortir mutuellement des difficultés. Leur loyauté repose sur la confiance acquise.", "friction": "Leurs doutes s'additionnent : la procrastination et les messages ambigus les paralysent.", "aDirige": "Le Six qui dirige oscille entre laxisme et contrôle excessif, et teste parfois la loyauté de l'équipe. Le Six subordonné envisage le pire en l'absence d'information et repère tout écart entre promesse et réalité.", "bDirige": "Entre pairs, ils se soutiennent, mais chacun craint de froisser l'autre et les sujets qui fâchent restent en suspens.", "conseil": "Annoncer les changements à l'avance, expliquer les intentions et parler franchement du pire scénario."}, "6-7": {"accroche": "Le doute et l'enthousiasme, à équilibrer.", "force": "S'ils s'écoutent, le Sept aide le Six à espérer une issue favorable et le Six aide le Sept à tenir le cap dans les passages difficiles.", "friction": "Tous deux changent facilement d'idée et repoussent l'échéance : beaucoup de réunions, peu de suivi.", "aDirige": "Le Six hésite à imposer et sur-réagit à ce qu'il prend pour un manque d'égards du Sept, qui a seulement élargi son rôle sans s'en rendre compte. Des mises au point formelles permettent d'expliquer les intentions.", "bDirige": "Le Sept délègue puis change d'avis en cours de route ; le Six, qui découvre ses tâches modifiées, se sent écarté. Bien informé et rassuré, il devient très loyal.", "conseil": "Expliquer tout changement avant de l'appliquer et fixer des points de suivi réguliers."}, "6-8": {"accroche": "Foncer ou peser : deux réponses opposées à la pression.", "force": "Le Huit apporte force et protection, le Six des idées solides et l'anticipation des risques.", "friction": "Sous pression, le Huit fonce et minimise l'opposition ; le Six se replie et grossit les risques, jusqu'à voir le Huit comme le problème.", "aDirige": "Le Six doit poser son autorité dès le départ. Intimidé, il oscille entre céder et sanctionner, alors que le Huit est rassuré par des limites nettes et appliquées.", "bDirige": "Le Huit protège son équipe, mais peut devenir écrasant ; le Six atténue les mauvaises nouvelles ou se fait discret. Des tête-à-tête où le Six peut s'exprimer sont précieux.", "conseil": "Fixer des limites claires, tenues sans hésitation, et laisser au Six un espace sûr pour formuler ses idées."}, "6-9": {"accroche": "Une association durable et paisible.", "force": "Le Six apporte des idées, le Neuf les rend concrètes. L'organisation stable et sans surprise du Neuf apaise le Six.", "friction": "Tous deux se laissent surcharger et prennent du retard. L'inertie du Neuf et le doute du Six peuvent se renvoyer la faute.", "aDirige": "Le Six peut prendre le manque d'initiative du Neuf pour une mauvaise volonté cachée. Il gagne à rester en contact avec l'équipe et à rappeler les réussites passées.", "bDirige": "Le Neuf évite le conflit et donne raison à chacun, ce qui inquiète le Six (« de quel côté êtes-vous ? »). Son cadre méthodique et sûr reste un vrai atout pour le Six.", "conseil": "Reconnaître les contributions sans mettre en concurrence : sécurité à long terme pour le Six, reconnaissance spontanée pour le Neuf."}, "7-7": {"accroche": "Une énergie contagieuse, des suivis fragiles.", "force": "Ils apprennent vite, excellent dans les situations nouvelles et dans le lancement de projets courts.", "friction": "Les idées en appellent d'autres et le suivi s'évapore. Les attentes excessives et la difficulté à entendre la critique créent des malentendus.", "aDirige": "Le Sept qui dirige crée et délègue ; s'il confie le suivi à un autre Sept, la confusion s'aggrave. Le Sept subordonné reste motivé tant que le chef l'est.", "bDirige": "Entre pairs, ils s'enthousiasment ensemble mais peuvent se séparer sur les suites à donner à une idée.", "conseil": "Distinguer clairement consigne et simple idée, et présenter une erreur comme un nouveau départ."}, "7-8": {"accroche": "Deux fonceurs : fructueux si la confiance tient.", "force": "Tous deux passent vite de l'idée à l'action. Le Sept invente, le Huit apporte un appui solide et protecteur.", "friction": "Le Sept se disperse, le Huit fonce en tout ou rien. Le Huit craint de perdre le contrôle, le Sept d'être dominé.", "aDirige": "Le Sept doit faire ses preuves : le Huit veut des règles claires et un chef équitable. Avec de la loyauté en retour, le Huit le soutient au quotidien.", "bDirige": "Le Sept ajuste les règles à sa façon ; quand le Huit le découvre, il soupçonne pire. Des comptes rendus réguliers, même négatifs, rassurent le Huit, qui doit aussi apprendre à écouter.", "conseil": "Informer en continu, y compris des mauvaises nouvelles, et recourir à un tiers si la confiance vacille."}, "7-9": {"accroche": "Souplesse et constance, à faire coïncider.", "force": "Le Sept est très flexible, le Neuf fonctionne par habitude : ces styles se complètent. Le Neuf excelle dans l'organisation que le Sept délaisse.", "friction": "Ils dispersent leur temps. Le Sept peut récolter un mérite que le Neuf, discret, a gagné ; le Neuf se ferme alors en silence.", "aDirige": "Le Neuf dirige par l'harmonie et la routine, que le Sept trouve étouffantes. Tous deux évitent la colère : sans contrôles programmés, le Sept contourne et le Neuf accumule les griefs.", "bDirige": "Le Sept est peu présent et change les plans sans prévenir, ce qui ralentit le Neuf. Il doit écouter ses griefs plutôt que le charmer avec des promesses vagues.", "conseil": "Fixer des échéances et des points de suivi réguliers, et attribuer clairement le mérite du travail."}, "8-8": {"accroche": "Respect mutuel ou lutte de pouvoir.", "force": "Ils n'ont pas peur du conflit et avancent sous la pression. Dans le même camp, ils se rendent des services de façon loyale.", "friction": "Deux Huit, c'est presque toujours une lutte de pouvoir. La moindre manœuvre déclenche une forte résistance, voire un désir de revanche.", "aDirige": "Le Huit qui dirige respecte l'ambition et accorde des avantages pour s'assurer la loyauté ; le Huit subordonné se dresse contre ce qu'il juge injuste et peut fédérer les mécontents.", "bDirige": "Entre pairs, ils coopèrent si les règles du jeu sont claires et l'intérêt commun évident.", "conseil": "Traiter le problème tôt, en tête-à-tête, sans retenir l'information, et avec un médiateur si le ton monte."}, "8-9": {"accroche": "Puissance et apaisement : très constructif s'ils se parlent.", "force": "Le Huit prend les initiatives et gère les conflits, le Neuf apporte médiation et soutien.", "friction": "Le Huit exprime directement son mécontentement, le Neuf le manifeste par une résistance passive.", "aDirige": "Le Huit entraîne le Neuf dans un effort collectif, mais l'excès de pression le fait se retrancher. Il gagne à valoriser ses contributions et à préférer un rythme tenable.", "bDirige": "Le Neuf recherche le consensus ; ses hésitations inquiètent le Huit, qui teste alors son autorité. Le Huit attend des messages clairs et des règles objectives.", "conseil": "Faire dire franchement ce qui ne va pas : le Huit veut la vérité, le Neuf est soulagé de la dire."}, "9-9": {"accroche": "Un fonctionnement paisible, qui fuit les décisions.", "force": "Ils aiment s'appuyer sur un programme et perfectionner peu à peu un système jusqu'à ce qu'il tourne seul.", "friction": "Ils évitent les décisions difficiles ; un désaccord non exprimé peut ressurgir plus tard sous forme de sentiment de trahison.", "aDirige": "Le Neuf qui dirige peine à donner des directives nettes et se noie dans les points de vue ; le Neuf subordonné se cale sur la routine et évite de bousculer les choses.", "bDirige": "Entre pairs, l'entente est facile, mais il faut souvent un tiers pour faire émerger la position de chacun.", "conseil": "Fixer un calendrier par étapes pour chaque décision plutôt qu'exiger une réponse immédiate."}};

<script>

const $ = s => document.querySelector(s);

const ROUTES = [];
function route(re, fn){ ROUTES.push([re, fn]); }
let premier = true;
function aller(h){ location.hash = h; }
function rendre(){
  const h = location.hash.replace(/^#/, "") || "/";
  for (const [re, fn] of ROUTES){
    const m = h.match(re);
    if (m){
      const r = fn(...m.slice(1));
      fermerMenu();
      $("#app").innerHTML = `${fil(h)}<div class="vue">${r.html}</div>${pied()}`;
      $("#titre").textContent = r.titre || "Les neuf profils au travail";
      document.title = (r.titre ? r.titre + " · " : "") + "Les neuf profils au travail";
      $("#retour").classList.toggle("vu", h !== "/");
      const y = lireScroll(h);
      window.scrollTo(0, y);
      if (r.apres) r.apres();
      return;
    }
  }
  aller("/");
}
const memo = {};
function lireScroll(h){ try { return +(sessionStorage.getItem("sc:" + h) || memo[h] || 0); } catch(e){ return memo[h] || 0; } }
function noterScroll(){ const h = location.hash.replace(/^#/, "") || "/"; memo[h] = window.scrollY; try { sessionStorage.setItem("sc:" + h, window.scrollY); } catch(e){} }
let profondeur = 0;
window.addEventListener("hashchange", () => { rendre(); });
window.addEventListener("scroll", () => { clearTimeout(window._st); window._st = setTimeout(noterScroll, 120); }, {passive:true});
document.addEventListener("click", e => {
  const a = e.target.closest("[data-go]");
  if (a){ e.preventDefault(); const cur = location.hash.replace(/^#/, "") || "/"; if (a.dataset.go === cur){ fermerMenu(); return; } noterScroll(); profondeur++; aller(a.dataset.go); }
});
$("#retour").onclick = () => { noterScroll(); if (profondeur > 0){ profondeur--; history.back(); } else { aller("/"); } };
function fil(h){
  if (h === "/") return "";
  const p = [`<a data-go="/">Accueil</a>`];
  let m;
  const SOUS = {communication:"Communication",progresser:"Mieux communiquer",stress:"Stress et confiance",variantes:"Variantes",manager:"Diriger",energie:"Énergie",confusions:"Confusions"};
  if ((m = h.match(/^\/type\/([1-9])(?:\/(\w+))?$/))){
    p.push(m[2] ? `<a data-go="/type/${m[1]}">${m[1]} · ${esc(nomT(m[1]))}</a>` : `<b>${m[1]} · ${esc(nomT(m[1]))}</b>`);
    if (m[2]) p.push(`<b>${SOUS[m[2]]||""}</b>`);
    const s = m[2] ? "/" + m[2] : "";
    return `<div class="fil">${p.join('<span>›</span>')}</div><div class="choix-type" aria-label="Changer de profil">${[3,2,4,5,6,7,8,9,1].map(k => `<button data-go="/type/${k}${s}" class="${k==m[1]?"ici":""}" style="--c:var(--${CENTRE_DE[k]})" aria-label="Profil ${k}">${k}</button>`).join("")}</div>`;
  }
  if ((m = h.match(/^\/duo\/(\d)-(\d)$/))){ p.push(`<a data-go="/ententes">Ententes</a>`, `<b>Duo ${m[1]} · ${m[2]}</b>`); }
  else if ((m = h.match(/^\/centre\/(\w+)$/))) p.push(`<b>${CENTRES[m[1]].nom}</b>`);
  else { const L = {"/communiquer":"Communiquer","/etats":"Quand ça va, quand ça ne va pas","/ententes":"Ententes","/dynamique":"Ce qui fait bouger un profil","/test":"Se situer"}; p.push(`<b>${L[h]||""}</b>`); }
  return `<div class="fil">${p.join('<span>›</span>')}</div>`;
}
function remplirMenu(){

  const lien = (go, txt, sous="") => `<button class="m-lien${h===go?" ici":""}" data-go="${go}"><span><b>${txt}</b>${sous?`<small>${sous}</small>`:""}</span><span class="chev">›</span></button>`;

    ${lien("/", "Accueil", "Le cercle des neuf profils")}

/* ---------- Cercle ---------- */
function cercle(opts={}){
  const R = 140, cx = 180, cy = 180;
  const pos = n => { const a = (n % 9) * 40 * Math.PI / 180; return [cx + R * Math.sin(a), cy - R * Math.cos(a)]; };
  let fl = "";
  if (opts.fleches){
    const seq = [[1,4],[4,2],[2,8],[8,5],[5,7],[7,1],[3,9],[9,6],[6,3]];
    fl = seq.map(([a,b]) => { const [x1,y1]=pos(a),[x2,y2]=pos(b); const k=0.83; const xe=x1+(x2-x1)*k, ye=y1+(y2-y1)*k; const xs=x1+(x2-x1)*0.17, ys=y1+(y2-y1)*0.17; return `<line x1="${xs}" y1="${ys}" x2="${xe}" y2="${ye}" stroke="var(--rouge)" stroke-width="1.6" marker-end="url(#fl)" opacity=".75"/>`; }).join("");
  } else {
    const seq = [[1,4],[4,2],[2,8],[8,5],[5,7],[7,1],[3,9],[9,6],[6,3]];
    fl = seq.map(([a,b]) => { const [x1,y1]=pos(a),[x2,y2]=pos(b); return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--trait2)" stroke-width="1.2"/>`; }).join("");
  }
  const noeuds = [1,2,3,4,5,6,7,8,9].map(n => { const [x,y]=pos(n); const t=T(n); const lx = cx + (R+0) * Math.sin((n%9)*40*Math.PI/180); return `<g class="noeud" data-go="/type/${n}" role="link" aria-label="Type ${n}"><circle cx="${x}" cy="${y}" r="21" fill="var(--${CENTRE_DE[n]})"/><text x="${x}" y="${y+6}" text-anchor="middle" font-family="Inter" font-weight="700" font-size="17" fill="#fff">${n}</text></g>`; }).join("");
  const noms = opts.noms ? [1,2,3,4,5,6,7,8,9].map(n => { const a=(n%9)*40*Math.PI/180; const x=cx+(R+38)*Math.sin(a), y=cy-(R+38)*Math.cos(a)+4; const anc = Math.abs(Math.sin(a))<.2?"middle":(Math.sin(a)>0?"start":"end"); return `<text x="${x}" y="${y}" text-anchor="${anc}" font-size="11.5" font-weight="600" fill="var(--doux)">${esc((T(n)||{}).nom||"").replace(/^(Le |L')/,"")}</text>`; }).join("") : "";
  return `<svg class="cercle" viewBox="-40 -10 440 380" aria-label="Le cercle des neuf types"><defs><marker id="fl" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--rouge)"/></marker></defs><circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="var(--trait2)" stroke-width="1.5"/>${fl}${noeuds}${noms}</svg>`;
}

function miniFleches(n, t){
  const R = 70, cx = 100, cy = 92;
  const pos = k => { const a = (k % 9) * 40 * Math.PI / 180; return [cx + R * Math.sin(a), cy - R * Math.cos(a)]; };
  const fl = (a, b, col, id) => { const [x1,y1]=pos(a),[x2,y2]=pos(b); const d=Math.hypot(x2-x1,y2-y1); const ux=(x2-x1)/d, uy=(y2-y1)/d; return `<line x1="${x1+ux*15}" y1="${y1+uy*15}" x2="${x2-ux*17}" y2="${y2-uy*17}" stroke="${col}" stroke-width="2.4" marker-end="url(#${id})"/>`; };
  const s = t.stress.vers, k = t.confiance.vers;
  const nds = [1,2,3,4,5,6,7,8,9].map(m => { const [x,y]=pos(m); const actif = m===n||m===s||m===k; const fill = m===n ? `var(--${CENTRE_DE[m]})` : m===s ? "var(--rouge)" : m===k ? "var(--vert)" : "var(--carte)"; return `<circle cx="${x}" cy="${y}" r="${m===n?14:12}" fill="${fill}" stroke="${actif?"none":"var(--trait2)"}"/><text x="${x}" y="${y+4.5}" text-anchor="middle" font-family="Inter" font-weight="700" font-size="${m===n?14:12}" fill="${actif?"#fff":"var(--pale)"}">${m}</text>`; }).join("");
  return `<div class="carte mini"><svg viewBox="0 0 200 184" aria-label="Directions de stress et de confiance du ${n}"><defs><marker id="mr${n}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--rouge)"/></marker><marker id="mv${n}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--vert)"/></marker></defs><circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="var(--trait)" stroke-width="1.2"/>${fl(n,s,"var(--rouge)","mr"+n)}${fl(n,k,"var(--vert)","mv"+n)}${nds}</svg><div class="leg"><span><i style="background:var(--rouge)"></i>Sous stress → ${s}</span><span><i style="background:var(--vert)"></i>En confiance → ${k}</span></div></div>`;
}

/* ---------- Accueil ---------- */
function grandCercle(sel){
  const R = 128, cx = 180, cy = 168;
  const pos = (n, r=R) => { const a = (n % 9) * 40 * Math.PI / 180; return [cx + r * Math.sin(a), cy - r * Math.cos(a)]; };
  const seq = [[1,4],[4,2],[2,8],[8,5],[5,7],[7,1],[3,9],[9,6],[6,3]];
  const lignes = seq.map(([a,b]) => { const [x1,y1]=pos(a),[x2,y2]=pos(b); return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--trait2)" stroke-width="1" opacity="${sel?.35:1}"/>`; }).join("");
  let fl = "";
  if (sel){
    const t = T(sel); const f = (a, b, col, id) => { const [x1,y1]=pos(a),[x2,y2]=pos(b); const d=Math.hypot(x2-x1,y2-y1); const ux=(x2-x1)/d, uy=(y2-y1)/d; return `<line class="trace" x1="${x1+ux*25}" y1="${y1+uy*25}" x2="${x2-ux*27}" y2="${y2-uy*27}" stroke="${col}" stroke-width="2.6" stroke-linecap="round" marker-end="url(#${id})"/>`; };
    fl = f(sel, t.stress.vers, "var(--rouge)", "gr") + f(sel, t.confiance.vers, "var(--vert)", "gv");
  }
  const nds = [1,2,3,4,5,6,7,8,9].map(n => { const [x,y]=pos(n); const on = n===sel; const dim = sel && !on && n!==T(sel).stress.vers && n!==T(sel).confiance.vers; const nm = esc((T(n)||{}).nom||"").replace(/^(Le |L')/,""); const delai = ((n % 9) * 0.12).toFixed(2); const a=(n%9)*40*Math.PI/180; const [lx,ly]=pos(n,R+40); const anc=Math.abs(Math.sin(a))<.2?"middle":(Math.sin(a)>0?"start":"end");
    return `<g class="noeud${on?" on":""}" data-sel="${n}" role="button" aria-label="Type ${n}, ${nm}" style="opacity:${dim?.45:1}"><circle cx="${x}" cy="${y}" r="30" fill="transparent"/>${sel?"":`<circle class="halo" cx="${x}" cy="${y}" r="21" fill="var(--${CENTRE_DE[n]})" style="animation-delay:${delai}s"/>`}${on?`<circle cx="${x}" cy="${y}" r="29" fill="none" stroke="var(--${CENTRE_DE[n]})" stroke-width="2" opacity=".35"/>`:""}<circle class="pastille-c" cx="${x}" cy="${y}" r="${on?24:21}" fill="var(--${CENTRE_DE[n]})" style="transform-origin:${x}px ${y}px"/><text x="${x}" y="${y+6}" text-anchor="middle" font-family="Inter" font-weight="700" font-size="${on?19:17}" fill="#fff">${n}</text><text x="${lx}" y="${ly+4}" text-anchor="${anc}" font-size="13.5" font-weight="${on?700:600}" fill="var(--encre)" class="nom-c">${nm}</text></g>`; }).join("");
  const centre = sel ? "" : `<g class="invite"><g transform="translate(${cx-11} ${cy-46}) scale(.92)" fill="none" stroke="var(--encre)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11V4.5a2 2 0 0 1 4 0V10"/><path d="M13 9.5a2 2 0 0 1 4 0V11"/><path d="M17 10.5a2 2 0 0 1 4 0V15a7 7 0 0 1-7 7h-1.2a6 6 0 0 1-4.6-2.2L4.4 16a1.9 1.9 0 0 1 2.8-2.6L9 15"/></g><text x="${cx}" y="${cy+8}" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="19" font-weight="650" fill="var(--encre)">Touchez</text><text x="${cx}" y="${cy+30}" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="19" font-weight="650" fill="var(--encre)">un profil</text></g>`;
  return `<svg class="grand-cercle" viewBox="-50 -12 460 360"><defs><marker id="gr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--rouge)"/></marker><marker id="gv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--vert)"/></marker></defs><circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="var(--trait2)" stroke-width="1.4"/>${lignes}${fl}${centre}${nds}</svg>`;
}
function panneau(sel){
  if (!sel) return `<div class="legende"><span><i style="background:var(--coeur)"></i>Émotionnelle</span><span><i style="background:var(--tete)"></i>Mentale</span><span><i style="background:var(--ventre)"></i>Instinctive</span></div><p class="note" style="text-align:center;margin-top:6px">La couleur indique l'intelligence que chaque profil utilise en premier.</p>`;
  const t = T(sel), c = CENTRE_DE[sel];
  return `<div class="carte choix c-${c}"><div class="lien" style="align-items:flex-start">${puce(sel)}<div style="flex:1"><div class="sur" style="color:var(--c);margin:0 0 2px">Intelligence ${CENTRES[c].court}</div><h3 style="margin:0">${esc(t.nom)}</h3><p class="note" style="margin:4px 0 0;font-style:italic">« ${esc(t.devise)} »</p></div></div>
    <div class="fl2"><div><i style="background:var(--rouge)"></i>Sous stress → <b>${t.stress.vers}</b> ${esc(nomT(t.stress.vers))}</div><div><i style="background:var(--vert)"></i>En confiance → <b>${t.confiance.vers}</b> ${esc(nomT(t.confiance.vers))}</div></div>
    <button class="btn" data-go="/type/${sel}" style="width:100%;justify-content:center;margin-top:14px">Ouvrir le profil</button></div>`;
}

  <h1>Les neuf, quand ça va… et quand ça ne va pas</h1>

/* ---------- Dynamique ---------- */
route(/^\/dynamique$/, () => ({ titre: "Ce qui fait bouger un profil", html: `
  <h1>Ce qui fait bouger un profil</h1>
  <p class="lead" style="margin-top:10px">Le profil de base reste le même ; tout le reste est en mouvement.</p>
  <div class="carte"><h3>1 · Les flèches : stress et confiance</h3><p>Sous stress, chacun prend certains travers d'un autre type ; en confiance, certaines qualités d'un autre encore. Les flèches rouges montrent la direction du stress ; la confiance suit le sens inverse.</p>${cercle({fleches:true})}
  <table class="tab"><tr><th>Type</th><th style="color:var(--rouge)">Sous stress</th><th style="color:var(--vert)">En confiance</th></tr>${[1,2,3,4,5,6,7,8,9].map(n=>`<tr class="ligne-type" data-go="/type/${n}/stress"><td>${puce(n)}</td><td>→ ${STRESS[n]} · ${esc(nomT(STRESS[n]))}</td><td>→ ${CONF[n]} · ${esc(nomT(CONF[n]))}</td></tr>`).join("")}</table>
  <p class="note">D'après D. Riso et R. Hudson, H. Palmer. Certains auteurs lisent ces lignes autrement.</p></div>
  <div class="carte"><h3>2 · Les niveaux : du meilleur au plus tendu</h3><p>Chaque type se vit à différents niveaux de liberté : sain, moyen, tendu. La plupart des gens vivent dans la zone moyenne. Chacun a un niveau habituel et une marge de variation : une journée difficile peut faire descendre de plusieurs crans, un succès faire remonter.</p><p class="note">Les niveaux mesurent la liberté intérieure du moment, pas l'intelligence ni la valeur. L'humeur n'est pas le niveau. (D. Riso et R. Hudson)</p>${plus("/etats","Les neuf, quand ça va et quand ça ne va pas")}</div>
  <div class="carte"><h3>3 · Les ailes : les voisins</h3><p>Chaque type est coloré par l'un de ses deux voisins sur le cercle. Un 3 « aile 2 » est plus chaleureux et tourné vers les gens ; un 3 « aile 4 » plus soucieux de son style, plus en retenue.</p></div>
  <div class="carte"><h3>4 · Les instincts : où se joue l'essentiel</h3>
    <div class="reac"><span class="etiq">Conservation</span><p>Sécurité, ressources, conditions de travail. En entrant dans une salle, il remarque le confort, l'organisation, la charge à venir.</p></div>
    <div class="reac"><span class="etiq">Social</span><p>La place dans le groupe, l'institution, les réseaux. En entrant, il perçoit qui a de l'influence, qui parle avec qui.</p></div>
    <div class="reac"><span class="etiq">Tête-à-tête</span><p>La relation directe, choisie, intense avec une personne. En entrant, il va vers l'interlocuteur qui compte.</p></div>
    <p class="note" style="margin-top:8px">Les trois vivent en chacun ; l'un domine, et il peut changer selon les périodes de la vie (B. Chestnut ; D. Riso et R. Hudson).</p></div>
  <div class="bandeau"><b>Ce que l'ennéagramme ne dit pas.</b> Il éclaire des motivations, souvent inconscientes. Il ne remplace ni la connaissance de la personne, ni sa psychologie, ni sa culture, ni son histoire. Il sert à mieux se comprendre et à mieux s'adresser aux autres, jamais à les classer.</div>`}));

let REP = {};
try { REP = JSON.parse(localStorage.getItem("test-rep") || "{}"); } catch(e){ REP = {}; }
function sauverRep(){ try { localStorage.setItem("test-rep", JSON.stringify(REP)); } catch(e){} }
route(/^\/test$/, () => ({ titre: "Se situer", html: `
  <h1>Se situer</h1>
  <p class="lead" style="margin-top:10px">27 situations de travail. Répondez spontanément, en pensant à votre façon habituelle d'être, pas à celle que vous aimeriez avoir.</p>
  <div class="bandeau"><b>Une piste, pas un verdict.</b> Un questionnaire ne détermine pas un type : il suggère des profils à lire. C'est en lisant les fiches, et surtout les motivations, que l'on se reconnaît… ou pas.</div>
  <div class="progress"><i id="prog" style="width:0"></i></div>
  <div class="carte" id="qs">
    ${ITEMS.map(([t,s],i) => `<div class="q"><p>${i+1}. ${esc(s)}</p><div class="echelle" data-i="${i}">${[1,2,3,4,5].map(v=>`<button data-v="${v}" class="${REP[i]==v?"on":""}">${v}</button>`).join("")}</div><div class="echelle-leg"><span>Pas du tout</span><span>Tout à fait</span></div></div>`).join("")}
  </div>
  <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" id="voir">Voir mes pistes</button><button class="btn sec" id="raz">Recommencer</button></div>
  <div id="res"></div>`,
  apres(){
    const maj = () => { $("#prog").style.width = (Object.keys(REP).length / ITEMS.length * 100) + "%"; };
    maj();
    $("#qs").addEventListener("click", e => { const b = e.target.closest("button[data-v]"); if(!b) return; const g = b.parentElement; REP[g.dataset.i] = +b.dataset.v; g.querySelectorAll("button").forEach(x => x.classList.toggle("on", x===b)); sauverRep(); maj(); });
    $("#raz").onclick = () => { REP = {}; sauverRep(); rendre(); };
    $("#voir").onclick = () => {
      const nb = Object.keys(REP).length;
      if (nb < 20){ $("#res").innerHTML = `<p class="note" style="margin-top:12px">Répondez à au moins 20 situations (${nb} pour l'instant).</p>`; return; }
      const sc = {}; for (let n=1;n<=9;n++) sc[n]=[0,0];
      ITEMS.forEach(([t],i) => { if (REP[i]) { sc[t][0]+=REP[i]; sc[t][1]++; } });
      const moy = Object.entries(sc).map(([n,[s,c]]) => [+n, c ? s/c : 0]).sort((a,b)=>b[1]-a[1]);
      const cen = {coeur:0,ventre:0,tete:0}; moy.forEach(([n,v]) => cen[CENTRE_DE[n]] += v);
      const cmax = Object.entries(cen).sort((a,b)=>b[1]-a[1])[0][0];
      $("#res").innerHTML = `<div class="carte" style="margin-top:16px"><h3>Vos pistes de lecture</h3><p class="note">Les trois profils qui ressortent le plus. Lisez-les, et surtout leur motivation : c'est elle qui permet de se reconnaître.</p>
        ${moy.slice(0,3).map(([n]) => `<button class="carte lien c-${CENTRE_DE[n]}" data-go="/type/${n}" style="margin:8px 0">${puce(n)}<span style="flex:1"><b>${esc(nomT(n))}</b><br><small class="note">${esc((T(n)||{}).enUnMot||"")}</small></span><span>›</span></button>`).join("")}
        <p style="margin-top:12px">Intelligence la plus marquée : <b>${CENTRES[cmax].nom}</b> · ${CENTRES[cmax].mot}.</p>
        <div style="margin-top:12px">${moy.map(([n,v]) => `<div class="barre-res c-${CENTRE_DE[n]}"><span>${n} · ${esc(nomT(n))}</span><div class="b"><i style="width:${(v-1)/4*100}%"></i></div><span class="note">${v.toFixed(1)}</span></div>`).join("")}</div>
        <p class="note" style="margin-top:12px">Vos réponses restent sur cet appareil ; elles ne sont envoyées nulle part.</p></div>`;
      $("#res").scrollIntoView({behavior:"smooth"});
    };
  }
}));

rendre();
</script>
</body>
